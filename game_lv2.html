<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic Game - LEVEL 2 (INSANE)</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');

        body {
            overflow: hidden;
            font-family: 'Bangers', cursive;
            user-select: none;
            background-color: #220000 !important;
        }

        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #score-board {
            font-size: 4rem;
            color: #ff0000;
            text-shadow: 2px 2px #fff;
            margin-top: 50px;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px);
            }

            50% {
                transform: translate(-1px, 2px);
            }

            100% {
                transform: translate(1px, -2px);
            }
        }

        #instruction {
            font-size: 5rem;
            color: white;
            text-shadow: 0 0 20px #ff0000;
            margin-top: 10px;
            text-align: center;
            line-height: 1;
            width: 90%;
        }

        #timer-bar {
            width: 80%;
            height: 30px;
            background: #000;
            margin-top: 20px;
            border-radius: 5px;
            border: 4px solid #ff0000;
            overflow: hidden;
        }

        #timer-fill {
            height: 100%;
            width: 100%;
            background: #ff0000;
            transform-origin: left;
        }

        #webcam-wrapper {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            border: 4px solid #ff0000;
            border-radius: 0;
            overflow: hidden;
            z-index: 5;
            background: black;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            filter: contrast(1.5) grayscale(0.5);
        }

        #start-screen,
        #game-over-screen,
        #pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }

        h1 {
            font-size: 6rem;
            color: #ff0000;
            margin: 0;
            letter-spacing: 5px;
            text-align: center;
            text-shadow: 0 0 10px white;
        }

        button.game-btn {
            padding: 20px 60px;
            font-size: 2.5rem;
            font-family: 'Bangers', cursive;
            background: #ff0000;
            color: white;
            border: 2px solid white;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.1s;
        }

        button.game-btn:hover {
            transform: scale(1.1);
            background: white;
            color: red;
        }

        .back-link {
            margin-top: 20px;
            color: #ffaaaa;
            font-family: 'Segoe UI', sans-serif;
            cursor: pointer;
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .game-menu-btn {
            background: transparent;
            border: 1px solid #ff0000;
            color: #ff0000;
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .game-menu-btn:hover {
            background: #ff0000;
            color: #fff;
        }
    </style>
</head>

<body>

    <canvas id="menu-canvas"
        style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;"></canvas>

    <div id="start-screen">
        <h1>LEVEL 2: INSANE</h1>
        <p style="color:white; font-size:1.5rem">SPEED RUN. 2 SECONDS PER FACE.</p>
        <button id="start-btn" class="game-btn" onclick="startGame()">SURVIVE</button>
        <div class="back-link" onclick="window.location.href='game_hub.html'">← I'm scared, go back</div>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 style="color: white;">YOU DIED</h1>
        <p id="final-score" style="font-size: 3rem; color: red;">Score: 0</p>
        <p id="roast-msg" style="color: #ffaaaa; font-size: 1.5rem;">Too slow for Level 2.</p>
        <button class="game-btn" onclick="startGame()">TRY AGAIN</button>
        <div class="back-link" onclick="window.location.href='game_hub.html'">← Give Up</div>
    </div>

    <div id="pause-screen" class="hidden">
        <h1 style="color: white">PAUSED</h1>
        <button class="game-btn" onclick="togglePause()">RESUME</button>
    </div>

    <div id="ui-container" class="hidden">
        <div id="score-board">SCORE: 0</div>
        <div id="instruction">READY?</div>
        <div id="timer-bar">
            <div id="timer-fill"></div>
        </div>
    </div>

    <div id="webcam-wrapper">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getFirestore, collection, addDoc, query, where, orderBy, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

        const FIREBASE_CONFIG = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(FIREBASE_CONFIG);
        const db  = getFirestore(app);

        // Expose to global scope so gameOver() can call it
        window._db          = db;
        window._collection  = collection;
        window._addDoc      = addDoc;
        window._query       = query;
        window._where       = where;
        window._orderBy     = orderBy;
        window._limit       = limit;
        window._getDocs     = getDocs;
    </script>

    <script src="main.js"></script>
    <script src="audio-fx.js"></script>
    <script src="ai-voice.js"></script>
    <script src="capture-module.js"></script>

    <script>
        // ─── START SCREEN BACKGROUND ───────────────────────────────────
        (function () {
            const mc = document.getElementById('menu-canvas');
            const mx = mc.getContext('2d');
            let mw, mh;
            const faces = ['😁', '😲', '😡', '😔', '😉', '🤯', '😱', '🤬', '🙄', '😎'];
            const mparts = [];

            function mResize() {
                mw = mc.width = window.innerWidth;
                mh = mc.height = window.innerHeight;
            }
            window.addEventListener('resize', mResize);
            mResize();

            class MP {
                constructor() { this.reset(true); }
                reset(init) {
                    this.x = Math.random() * mw;
                    this.y = init ? Math.random() * mh : mh + 60;
                    this.size = Math.random() * 52 + 28;
                    this.e = faces[Math.floor(Math.random() * faces.length)];
                    this.vx = (Math.random() - 0.5) * 0.6;
                    this.vy = -(Math.random() * 0.35 + 0.15);
                    this.spin = (Math.random() - 0.5) * 0.015;
                    this.a = Math.random() * Math.PI * 2;
                    this.op = Math.random() * 0.25 + 0.25;
                }
                tick() {
                    this.x += this.vx; this.y += this.vy; this.a += this.spin;
                    if (this.y < -60) this.reset(false);
                }
                draw() {
                    mx.save();
                    mx.translate(this.x, this.y);
                    mx.rotate(this.a);
                    mx.globalAlpha = this.op;
                    mx.font = this.size + 'px sans-serif';
                    mx.fillText(this.e, -this.size / 2, this.size / 3);
                    mx.restore();
                }
            }

            for (let i = 0; i < 28; i++) mparts.push(new MP());

            // Subtle grid lines
            function drawGrid() {
                mx.strokeStyle = 'rgba(255,0,0,0.04)';
                mx.lineWidth = 1;
                const spacing = 60;
                for (let x = 0; x < mw; x += spacing) {
                    mx.beginPath(); mx.moveTo(x, 0); mx.lineTo(x, mh); mx.stroke();
                }
                for (let y = 0; y < mh; y += spacing) {
                    mx.beginPath(); mx.moveTo(0, y); mx.lineTo(mw, y); mx.stroke();
                }
            }

            // Radial gradient glow at center
            function drawGlow() {
                const g = mx.createRadialGradient(mw / 2, mh / 2, 0, mw / 2, mh / 2, mw * 0.55);
                g.addColorStop(0, 'rgba(255,0,0,0.09)');
                g.addColorStop(0.5, 'rgba(180,0,0,0.04)');
                g.addColorStop(1, 'transparent');
                mx.fillStyle = g;
                mx.fillRect(0, 0, mw, mh);
            }

            function mAnimate() {
                mx.clearRect(0, 0, mw, mh);
                drawGrid();
                drawGlow();
                mparts.forEach(p => { p.tick(); p.draw(); });
                requestAnimationFrame(mAnimate);
            }
            mAnimate();
        })();
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        let score = 0;
        let maxTime = 2000;
        let difficultyMultiplier = 200;
        let isPlaying = false;
        let isPaused = false;
        let currentTarget = null;
        let lastFrameTime = 0;
        let roundStartTime = 0;
        let pausedTime = 0;
        let audioCtx;

        const CHALLENGES = [
            {
                name: "BIG SMILE!", emoji: "😁",
                check: (s) => (s.mouthSmileLeft + s.mouthSmileRight) / 2 > 0.16
            },
            {
                name: "SHOCK!", emoji: "😲",
                check: (s) => s.jawOpen > 0.17
                    || (s.jawOpen > 0.2 && (s.browOuterUpLeft + s.browOuterUpRight) / 2 > 0.2)
            },
            {
                name: "ANGRY!", emoji: "😡",
                check: (s) => (s.browDownLeft + s.browDownRight) / 2 > 0.15
                    || (s.browInnerUp > 0.2 && (s.browDownLeft + s.browDownRight) / 2 > 0.15)
            },
            {
                name: "WINK!", emoji: "😉",
                check: (s) => Math.abs(s.eyeBlinkLeft - s.eyeBlinkRight) > 0.14
                    || (Math.abs(s.eyeBlinkLeft - s.eyeBlinkRight) > 0.09
                        && Math.abs(s.cheekSquintLeft - s.cheekSquintRight) > 0.07)
            },
            {
                name: "PUFF CHEEKS!", emoji: "🐡",
                check: (s) => s.cheekPuff > 0.3
            },
            {
                name: "DISGUST!", emoji: "🤢",
                check: (s) => (s.noseSneerLeft + s.noseSneerRight) / 2 > 0.3
                    || ((s.noseSneerLeft + s.noseSneerRight) / 2 > 0.15
                        && (s.browDownLeft + s.browDownRight) / 2 > 0.2)
            },
            {
                name: "ROLL EYES UP!", emoji: "🙄",
                check: (s) => (s.eyeLookUpLeft + s.eyeLookUpRight) / 2 > 0.3
            },
            {
                name: "SQUINT!", emoji: "😑",
                check: (s) => (s.eyeSquintLeft + s.eyeSquintRight) / 2 > 0.28
                    || ((s.eyeSquintLeft + s.eyeSquintRight) / 2 > 0.15
                        && (s.cheekSquintLeft + s.cheekSquintRight) / 2 > 0.2)
            }
        ];

        const ROASTS = ["PATHETIC.", "TOO SLOW.", "IS THAT IT?", "GAME OVER.", "TRY HARDER."];

        let scene, camera, renderer, particles, particleVelocities = [], faceLandmarker, video;

        // --- MENU INJECTION ---
        function setupGameMenu() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) { requestAnimationFrame(setupGameMenu); return; }

            const forbidden = ['Analyzer', 'DEV TOOLS', 'Close', 'Guide', 'Cheat', 'Restart', 'Pause'];
            Array.from(sidebar.getElementsByTagName('button')).forEach(b => {
                if (forbidden.some(f => b.innerText.includes(f))) b.style.display = 'none';
            });
            Array.from(sidebar.getElementsByTagName('h3')).forEach(h => {
                if (forbidden.some(f => h.innerText.includes(f))) h.style.display = 'none';
            });

            const restartBtn = document.createElement('button');
            restartBtn.className = 'game-menu-btn';
            restartBtn.innerHTML = "🔄 Restart Run";
            restartBtn.onclick = () => { toggleMenu(); startGame(); };
            sidebar.appendChild(restartBtn);

            const pauseBtn = document.createElement('button');
            pauseBtn.className = 'game-menu-btn';
            pauseBtn.id = 'menu-pause-btn';
            pauseBtn.innerHTML = "⏸️ Pause Run";
            pauseBtn.onclick = () => { toggleMenu(); togglePause(); };
            sidebar.appendChild(pauseBtn);
        }
        // setupGameMenu();

        window.togglePause = function () {
            if (!isPlaying) return;
            isPaused = !isPaused;
            const pauseScreen = document.getElementById('pause-screen');
            const menuBtn = document.getElementById('menu-pause-btn');

            if (isPaused) {
                pauseScreen.classList.remove('hidden');
                pausedTime = performance.now();
                if (menuBtn) menuBtn.innerHTML = "▶️ Resume Run";
            } else {
                pauseScreen.classList.add('hidden');
                roundStartTime += (performance.now() - pausedTime);
                if (menuBtn) menuBtn.innerHTML = "⏸️ Pause Run";
                animate();
            }
        };

        window.startGame = async function () {
            const btn = document.getElementById('start-btn');
            btn.disabled = true; btn.innerText = "LOADING AI (~5MB)...";
            btn.style.opacity = "0.7";

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            try {
                if (!scene) initThreeJS();
                if (!faceLandmarker) await initAI();
                btn.style.opacity = "1";
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('pause-screen').classList.add('hidden');
                document.getElementById('ui-container').classList.remove('hidden');

                score = 0; updateScore(0); isPlaying = true; isPaused = false;
                nextRound(); animate();
            } catch (err) { alert(err); btn.disabled = false; btn.innerText = "RETRY"; }
        };

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.domElement.style.position = "absolute";
            renderer.domElement.style.top = "0";
            renderer.domElement.style.zIndex = "1";
            document.body.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 1000; i++) { vertices.push(0, 0, 0); particleVelocities.push({ x: 0, y: 0, z: 0 }); }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            particles = new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0xff0000, size: 0.2, transparent: true }));
            scene.add(particles);
        }

        let glassesMode = false;

        async function initAI() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" },
                outputFaceBlendshapes: true, runningMode: "VIDEO", numFaces: 1
            });
            video = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' } });
                video.srcObject = stream;
            } catch (err) {
                const msg = err.name === 'NotAllowedError'
                    ? '🚫 Camera denied. Allow camera and reload.'
                    : '📷 No camera found. Connect a camera and reload.';
                const btn = document.getElementById('start-btn');
                if (btn) { btn.disabled = false; btn.innerText = msg; }
                throw err;
            }
            await new Promise(r => video.onloadeddata = r);
            await sampleGlassesMode();
        }

        async function sampleGlassesMode() {
            let maxBlink = 0;
            for (let i = 0; i < 30; i++) {
                await new Promise(r => setTimeout(r, 33));
                if (video.currentTime > 0) {
                    const r = faceLandmarker.detectForVideo(video, performance.now());
                    if (r.faceBlendshapes.length > 0) {
                        const s = {};
                        r.faceBlendshapes[0].categories.forEach(b => s[b.categoryName] = b.score);
                        const blink = (s.eyeBlinkLeft + s.eyeBlinkRight) / 2;
                        if (blink > maxBlink) maxBlink = blink;
                    }
                }
            }
            glassesMode = maxBlink < 0.08;
            if (glassesMode) console.log('[FaceVerse] Glasses mode active — eye thresholds reduced');
        }

        function nextRound() {
            if (!isPlaying) return;
            currentTarget = CHALLENGES[Math.floor(Math.random() * CHALLENGES.length)];
            const el = document.getElementById('instruction');
            el.innerHTML = `<span style="font-size:6rem">${currentTarget.emoji}</span><br>${currentTarget.name}`;
            el.style.color = "red";
            roundStartTime = performance.now();
            maxTime = Math.max(800, 2000 - (score * difficultyMultiplier));
        }

        function checkWin(blendshapes) {
            const s = {}; blendshapes.forEach(b => s[b.categoryName] = b.score);
            if (glassesMode) {
                s.eyeBlinkLeft = Math.min(1, s.eyeBlinkLeft * 1.4);
                s.eyeBlinkRight = Math.min(1, s.eyeBlinkRight * 1.4);
                s.eyeSquintLeft = Math.min(1, s.eyeSquintLeft * 1.35);
                s.eyeSquintRight = Math.min(1, s.eyeSquintRight * 1.35);
                s.eyeLookUpLeft = Math.min(1, s.eyeLookUpLeft * 1.3);
                s.eyeLookUpRight = Math.min(1, s.eyeLookUpRight * 1.3);
            }
            if (currentTarget.check(s)) {
                score++; updateScore(score); explodeParticles(); playSound(800 + (score * 100), "sawtooth");
                document.getElementById('instruction').innerText = "FAST!";
                document.getElementById('instruction').style.color = "white";
                currentTarget = null; setTimeout(nextRound, 400);
            }
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('ui-container').classList.add('hidden');
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = "Score: " + score;
            const prev = parseInt(localStorage.getItem('faceverse_hs_lv2') || '0');
            if (score > prev) {
                localStorage.setItem('faceverse_hs_lv2', score);
                document.getElementById('roast-msg').innerText = '🏆 NEW HIGH SCORE!';
            } else {
                document.getElementById('roast-msg').innerText = ROASTS[Math.floor(Math.random() * ROASTS.length)];
            }
            // Save run history locally
            const runs = JSON.parse(localStorage.getItem('faceverse_runs') || '[]');
            runs.push({ mode: 'Insane', score: score, date: new Date().toISOString() });
            localStorage.setItem('faceverse_runs', JSON.stringify(runs));
            // AI Voice + Sound FX
            if (typeof FX !== 'undefined') FX.fail();
            if (typeof Voice !== 'undefined') Voice.say('You died. Score: ' + score);
            playSound(100, "square");
            // Submit to Firebase global leaderboard
            if (score > 0) submitToLeaderboard('Insane', score);
        }

        async function submitToLeaderboard(mode, finalScore) {
            if (!window._db) return;
            const name = localStorage.getItem('faceverse_player_name') || 'Anonymous';
            try {
                await window._addDoc(
                    window._collection(window._db, 'leaderboard'),
                    {
                        name:      name.substring(0, 20),
                        score:     finalScore,
                        mode:      mode,
                        timestamp: Date.now()
                    }
                );
                console.log('[FaceVerse] Score submitted to leaderboard');
            } catch (e) {
                console.warn('[FaceVerse] Leaderboard submit failed (offline?):', e.message);
            }
        }

        function updateScore(v) { document.getElementById('score-board').innerText = "SCORE: " + v; }

        function playSound(f, t) {
            if (!audioCtx) return;
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = t; o.frequency.setValueAtTime(f, audioCtx.currentTime);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.1); o.stop(audioCtx.currentTime + 0.1);
        }

        function explodeParticles() {
            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < 1000; i++) {
                pos[i * 3] = 0; pos[i * 3 + 1] = 0; pos[i * 3 + 2] = 0;
                particleVelocities[i] = { x: (Math.random() - 0.5) * 1.5, y: (Math.random() - 0.5) * 1.5, z: (Math.random() - 0.5) * 1.5 };
            }
            particles.geometry.attributes.position.needsUpdate = true;
        }

        function animate() {
            if (!isPlaying) return;
            if (isPaused) return;

            requestAnimationFrame(animate);
            const now = performance.now();

            if (faceLandmarker && video.currentTime !== lastFrameTime) {
                lastFrameTime = video.currentTime;
                const r = faceLandmarker.detectForVideo(video, now);
                if (currentTarget && r.faceBlendshapes && r.faceBlendshapes.length > 0) checkWin(r.faceBlendshapes[0].categories);
            }
            if (currentTarget) {
                const rem = maxTime - (now - roundStartTime);
                if (rem <= 0) gameOver();
                else document.getElementById('timer-fill').style.transform = `scaleX(${rem / maxTime})`;
            }
            const pos = particles.geometry.attributes.position.array;
            for (let i = 0; i < 1000; i++) {
                pos[i * 3] += particleVelocities[i].x; pos[i * 3 + 1] += particleVelocities[i].y; pos[i * 3 + 2] += particleVelocities[i].z;
                particleVelocities[i].y -= 0.02;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

        window.addEventListener('beforeunload', () => {
            if (typeof renderer !== 'undefined' && renderer) renderer.dispose();
        });
    </script>

    <style>
        .global-game-controls { position:fixed; top:20px; right:20px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
