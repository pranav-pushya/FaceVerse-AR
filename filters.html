<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceVerse AR Filters</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            overflow: hidden;
            background-color: #050505;
            margin: 0;
            user-select: none;
        }

        /* --- FILTER BAR --- */
        #filter-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 850px;
            background: rgba(10, 10, 10, 0.8);
            padding: 12px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            overflow-x: auto;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            z-index: 20;
            scrollbar-width: none;
        }

        #filter-container::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.05);
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.01));
            color: white;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 6px;
            flex-shrink: 0;
            position: relative;
        }

        .filter-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        .filter-btn.active {
            border-color: var(--accent-color);
            background: rgba(0, 255, 204, 0.15);
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
        }

        .label {
            position: absolute;
            bottom: 5px;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.8);
            font-family: sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            opacity: 0;
            transition: 0.3s;
            transform: translateY(10px);
        }

        .filter-btn:hover .label {
            opacity: 1;
            transform: translateY(0);
        }

        .sep {
            width: 1px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 12px;
        }

        #webcam-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        #output-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 10;
            pointer-events: none;
        }

        #action-bar {
            position: absolute;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 25;
        }

        .action-btn {
            padding: 12px 25px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-family: sans-serif;
            font-weight: 800;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-snap {
            background: linear-gradient(135deg, #fff, #e0e0e0);
            color: black;
        }

        .btn-snap:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        .btn-gallery {
            background: rgba(20, 20, 20, 0.8);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: monospace;
            color: var(--accent-color);
            z-index: 50;
            background: rgba(0, 0, 0, 0.9);
            padding: 25px 40px;
            border-radius: 16px;
            border: 1px solid var(--accent-color);
            text-align: center;
        }

        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.8);
            z-index: 30;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: bold;
            font-family: sans-serif;
            transition: 0.3s;
        }

        #sidebar {
            background-color: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(20px) !important;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] #sidebar {
            background-color: rgba(255, 255, 255, 0.8) !important;
            border-left: 1px solid rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div id="flash-overlay"></div>
    <div id="loading">
        <div style="font-size: 40px; margin-bottom: 10px;">✨</div>
        LOADING ULTRA ENGINE...
    </div>
    <div class="back-btn" onclick="window.location.href='index.html'">← EXIT AR</div>

    <div id="action-bar">
        <button class="action-btn btn-gallery" onclick="window.location.href='gallery.html'">🖼️ Gallery</button>
        <button class="action-btn btn-snap" onclick="capturePhoto()">📸 Snap</button>
    </div>

    <video id="webcam-bg" autoplay playsinline></video>
    <canvas id="output-canvas"></canvas>

    <div id="filter-container">
        <div class="filter-btn" onclick="toggleFilter('iron', this)"><span>🤖</span><span class="label">IronHUD</span>
        </div>
        <div class="filter-btn" onclick="toggleFilter('thug', this)"><span>🕶️</span><span class="label">Thug</span>
        </div>
        <div class="filter-btn" onclick="toggleFilter('spider', this)"><span>🕷️</span><span class="label">Spider</span>
        </div>
        <div class="filter-btn" onclick="toggleFilter('matrix', this)"><span>👾</span><span class="label">Matrix</span>
        </div>
        <div class="filter-btn" onclick="toggleFilter('skull', this)"><span>💀</span><span class="label">Ghost</span>
        </div>

        <div class="sep"></div>

        <div class="filter-btn" onclick="toggleFilter('queen', this)"><span>👑</span><span class="label">Queen</span>
        </div>
        <div class="filter-btn" onclick="toggleFilter('cat', this)"><span>😺</span><span class="label">Kitty</span>
        </div>
        <div class="filter-btn" onclick="toggleFilter('dog', this)"><span>🐶</span><span class="label">Doggy</span>
        </div>
        <div class="filter-btn" onclick="toggleFilter('love', this)"><span>💖</span><span class="label">Love</span>
        </div>
        <div class="filter-btn" onclick="toggleFilter('devil', this)"><span>😈</span><span class="label">Devil</span>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm" } }
    </script>

    <script src="main.js"></script>

    <script>
        function fixMenu() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) { requestAnimationFrame(fixMenu); return; }
            const forbidden = ['Analyzer', 'Close', 'DEV TOOLS'];
            Array.from(sidebar.getElementsByTagName('button')).forEach(b => {
                if (forbidden.some(f => b.innerText.includes(f))) b.style.display = 'none';
            });
            Array.from(sidebar.getElementsByTagName('h3')).forEach(h => {
                if (forbidden.some(f => h.innerText.includes(f))) h.style.display = 'none';
            });
        }
        fixMenu();

        function capturePhoto() {
            const flash = document.getElementById('flash-overlay');
            flash.style.opacity = '1';
            setTimeout(() => flash.style.opacity = '0', 200);

            const video = document.getElementById('webcam-bg');
            const canvas = document.getElementById('output-canvas');
            const saveCanvas = document.createElement('canvas');
            saveCanvas.width = video.videoWidth;
            saveCanvas.height = video.videoHeight;
            const ctx = saveCanvas.getContext('2d');

            ctx.translate(saveCanvas.width, 0); ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, saveCanvas.width, saveCanvas.height);
            ctx.drawImage(canvas, 0, 0, saveCanvas.width, saveCanvas.height);

            const dataURL = saveCanvas.toDataURL('image/jpeg', 0.85);
            saveToGallery(dataURL);
        }

        function saveToGallery(dataURL) {
            try {
                let photos = JSON.parse(localStorage.getItem('faceverse_gallery') || '[]');
                photos.unshift({ date: new Date().toLocaleString(), img: dataURL });
                try {
                    localStorage.setItem('faceverse_gallery', JSON.stringify(photos));
                } catch (e) {
                    if (e.name === 'QuotaExceededError') {
                        alert('⚠️ Gallery is full! Delete some photos to save new ones.');
                    }
                }
            } catch (e) { alert("Storage Full! Delete some photos."); }
        }
    </script>

    <script type="module">
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                const rad = typeof r === 'number' ? r : r[0];
                this.beginPath();
                this.moveTo(x + rad, y); this.arcTo(x + w, y, x + w, y + h, rad);
                this.arcTo(x + w, y + h, x, y + h, rad); this.arcTo(x, y + h, x, y, rad);
                this.arcTo(x, y, x + w, y, rad); this.closePath();
            };
        }

        const video = document.getElementById('webcam-bg');
        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        let faceLandmarker;
        let activeFilter = null;

        // --- ANIMATION STATES ---
        let particles = [];
        let rainDrops = [];
        let thugY = -300;
        let thugVelocity = 0;
        let spiderOffset = 0;

        window.toggleFilter = function (name, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            if (activeFilter === name) {
                activeFilter = null;
            } else {
                activeFilter = name;
                btnElement.classList.add('active');
                particles = [];
                rainDrops = [];
                thugY = -300; thugVelocity = 0;
                spiderOffset = 0;

                if (name === 'matrix') {
                    for (let i = 0; i < 100; i++) {
                        rainDrops.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: Math.random() * 10 + 5 });
                    }
                }
            }
        }

        async function init() {
            try {
                const loadingEl = document.getElementById('loading');
                if (loadingEl) loadingEl.textContent = 'LOADING AI MODEL... (~5MB)';

                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");

                if (loadingEl) loadingEl.textContent = 'INITIALIZING ULTRA ENGINE...';
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" },
                    outputFaceLandmarks: true,
                    outputFaceBlendshapes: true,
                    runningMode: "VIDEO", numFaces: 1
                });

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: 1280, height: 720, facingMode: 'user' }
                    });
                    video.srcObject = stream;
                } catch (err) {
                    const msg = err.name === 'NotAllowedError'
                        ? '🚫 Camera access denied. Allow camera in browser settings and reload.'
                        : err.name === 'NotFoundError'
                            ? '📷 No camera detected on this device.'
                            : `⚠️ Camera error: ${err.message}`;
                    const loading = document.getElementById('loading');
                    if (loading) loading.innerHTML = `
                        <div style="text-align:center;padding:3rem">
                            <div style="font-size:3rem;margin-bottom:1rem">📷</div>
                            <p style="font-size:1rem;margin-bottom:1.5rem;color:#fff">${msg}</p>
                            <button onclick="location.reload()"
                                style="padding:.6rem 1.5rem;background:#00ffcc;color:#000;
                                       border:none;border-radius:8px;cursor:pointer;
                                       font-size:1rem;font-weight:bold">
                                Retry
                            </button>
                        </div>`;
                    return;
                }

                video.addEventListener("loadeddata", () => {
                    document.getElementById('loading').style.display = 'none';
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    renderLoop();
                });
            } catch (err) {
                const msg = err.name === 'NotAllowedError'
                    ? '🚫 Camera access denied. Allow camera in browser settings and reload.'
                    : err.name === 'NotFoundError'
                        ? '📷 No camera detected on this device.'
                        : `⚠️ Error: ${err.message}`;
                document.getElementById('loading').innerHTML = `
                        <div style="text-align:center; padding:1rem; color:var(--accent-color)">
                            <div style="font-size:3rem; margin-bottom:1rem">📷</div>
                            <p style="font-size:1rem; margin-bottom:1.5rem">${msg}</p>
                            <button onclick="location.reload()" 
                                style="padding:.6rem 1.5rem; background:var(--accent-color);
                                       color:#000; border:none; border-radius:8px;
                                       cursor:pointer; font-size:1rem; font-weight:bold">
                                Retry
                            </button>
                        </div>`;
            }
        }


        // ─── SHARED HELPERS ────────────────────────────────────────────────────────

        function getPoint(landmark) {
            return { x: landmark.x * canvas.width, y: landmark.y * canvas.height };
        }

        function getFaceMetrics(lm) {
            const lEye = getPoint(lm[33]);
            const rEye = getPoint(lm[263]);
            const nose = getPoint(lm[1]);
            const chin = getPoint(lm[152]);
            const fore = getPoint(lm[10]);
            const lCheek = getPoint(lm[234]);
            const rCheek = getPoint(lm[454]);
            const faceW = Math.hypot(rCheek.x - lCheek.x, rCheek.y - lCheek.y);
            const faceH = Math.hypot(chin.x - fore.x, chin.y - fore.y);
            const angle = Math.atan2(rEye.y - lEye.y, rEye.x - lEye.x);
            const cx = (lEye.x + rEye.x) / 2;
            const cy = (lEye.y + rEye.y) / 2;
            const eyeDist = Math.hypot(rEye.x - lEye.x, rEye.y - lEye.y);
            return { lEye, rEye, nose, chin, fore, lCheek, rCheek, faceW, faceH, angle, cx, cy, eyeDist };
        }

        function createGoldGradient(x, y, size) {
            const g = ctx.createLinearGradient(x - size, y, x + size, y);
            g.addColorStop(0, '#BF953F');
            g.addColorStop(0.2, '#FCF6BA');
            g.addColorStop(0.5, '#B38728');
            g.addColorStop(0.8, '#FBF5B7');
            g.addColorStop(1, '#AA771C');
            return g;
        }

        function drawHeart(x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y + size * 0.3);
            ctx.bezierCurveTo(x, y, x - size, y, x - size, y + size * 0.3);
            ctx.bezierCurveTo(x - size, y + size * 0.7, x, y + size * 1.2, x, y + size * 1.5);
            ctx.bezierCurveTo(x, y + size * 1.2, x + size, y + size * 0.7, x + size, y + size * 0.3);
            ctx.bezierCurveTo(x + size, y, x, y, x, y + size * 0.3);
            ctx.closePath();
        }

        // ─── 1. IRON HUD ───────────────────────────────────────────────────────────

        function drawIron(lm) {
            const { lEye, rEye, nose, fore, chin, faceW, faceH, angle, cx, cy, eyeDist } = getFaceMetrics(lm);
            const time = Date.now() * 0.002;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            // 3D Holographic Parallax Offset
            const pOff = Math.sin(time) * 5;

            // Face outline with Chromatic Aberration for 3D Hologram effect
            const outlineIds = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
            
            [-2, 0, 2].forEach(aberration => {
                ctx.strokeStyle = aberration < 0 ? 'rgba(255,0,0,0.3)' : (aberration > 0 ? 'rgba(0,0,255,0.3)' : 'rgba(0,255,255,0.8)');
                ctx.lineWidth = aberration === 0 ? 2 : 1;
                ctx.shadowBlur = aberration === 0 ? 15 : 0;
                ctx.shadowColor = 'cyan';
                ctx.beginPath();
                outlineIds.forEach((id, i) => {
                    const p = { x: lm[id].x * canvas.width - cx, y: lm[id].y * canvas.height - cy };
                    const rx = p.x * Math.cos(-angle) - p.y * Math.sin(-angle) + aberration * 2;
                    const ry = p.x * Math.sin(-angle) + p.y * Math.cos(-angle);
                    i === 0 ? ctx.moveTo(rx, ry) : ctx.lineTo(rx, ry);
                });
                ctx.closePath(); ctx.stroke();
            });

            // Eye targeting reticles (3D rotating)
            const lLocal = {
                x: (lEye.x - cx) * Math.cos(-angle) - (lEye.y - cy) * Math.sin(-angle),
                y: (lEye.x - cx) * Math.sin(-angle) + (lEye.y - cy) * Math.cos(-angle)
            };
            const rLocal = {
                x: (rEye.x - cx) * Math.cos(-angle) - (rEye.y - cy) * Math.sin(-angle),
                y: (rEye.x - cx) * Math.sin(-angle) + (rEye.y - cy) * Math.cos(-angle)
            };

            [lLocal, rLocal].forEach(pt => {
                const r = eyeDist * 0.35;
                ctx.strokeStyle = 'rgba(0,255,200,0.9)';
                ctx.lineWidth = 2;
                
                // Outer rotating ring
                ctx.beginPath(); 
                ctx.arc(pt.x, pt.y, r, time % (Math.PI*2), (time % (Math.PI*2)) + Math.PI*1.5); 
                ctx.stroke();
                
                // Crosshairs
                ctx.beginPath();
                ctx.moveTo(pt.x - r - 8, pt.y); ctx.lineTo(pt.x - r + 4, pt.y);
                ctx.moveTo(pt.x + r - 4, pt.y); ctx.lineTo(pt.x + r + 8, pt.y);
                ctx.moveTo(pt.x, pt.y - r - 8); ctx.lineTo(pt.x, pt.y - r + 4);
                ctx.moveTo(pt.x, pt.y + r - 4); ctx.lineTo(pt.x, pt.y + r + 8);
                ctx.stroke();
                
                // Inner 3D glow core
                const coreGrad = ctx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 8);
                coreGrad.addColorStop(0, '#fff'); coreGrad.addColorStop(0.5, '#00ffcc'); coreGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = coreGrad;
                ctx.beginPath(); ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2); ctx.fill();
            });

            // 3D Scan line with gradient depth
            const scanOffset = Math.sin(time * 2) * faceH * 0.45;
            const scanGrad = ctx.createLinearGradient(0, scanOffset - 20, 0, scanOffset + 20);
            scanGrad.addColorStop(0, 'transparent');
            scanGrad.addColorStop(0.5, 'rgba(0,255,255,0.8)');
            scanGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = scanGrad;
            ctx.fillRect(-faceW * 0.6, scanOffset - 20, faceW * 1.2, 40);
            
            ctx.beginPath();
            ctx.moveTo(-faceW * 0.6, scanOffset);
            ctx.lineTo(faceW * 0.6, scanOffset);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2; ctx.stroke();

            ctx.restore();
            ctx.shadowBlur = 0;

            // HUD text overlays (Holographic projection)
            ctx.fillStyle = 'rgba(0,255,204,0.9)';
            ctx.shadowBlur = 10; ctx.shadowColor = 'cyan';
            ctx.font = `bold ${Math.max(10, faceW * 0.07)}px monospace`;
            ctx.textAlign = 'left';
            ctx.fillText('TARGET LOCKED', fore.x - faceW * 0.3 + pOff, fore.y - faceH * 0.18);
            
            ctx.font = `${Math.max(8, faceW * 0.05)}px monospace`;
            ctx.fillStyle = 'rgba(0,255,204,0.7)';
            ctx.fillText(`CONF: ${(90 + Math.sin(time) * 5).toFixed(1)}%`, fore.x - faceW * 0.3 + pOff, fore.y - faceH * 0.1);
            ctx.fillText(`DIST: ${(faceW * 0.4).toFixed(0)}cm`, fore.x - faceW * 0.3 + pOff, fore.y - faceH * 0.03);
            ctx.shadowBlur = 0;
        }

        // ─── 2. THUG ───────────────────────────────────────────────────────────────

        function drawThug(lm) {
            const { lEye, rEye, cx, cy, angle, eyeDist } = getFaceMetrics(lm);
            const w = eyeDist * 2.6;
            const h = eyeDist * 0.55;

            if (thugY < 0) {
                thugVelocity += 2.5;
                thugY += thugVelocity;
            } else if (thugVelocity > 2) {
                thugVelocity = -thugVelocity * 0.4;
                thugY += thugVelocity;
            } else {
                thugY = 0; thugVelocity = 0;
            }

            ctx.save();
            ctx.translate(cx, cy + thugY);
            ctx.rotate(angle);

            // 3D Drop Shadow
            ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowOffsetY = 10;

            // Thick 3D Plastic Frame
            const frameGrad = ctx.createLinearGradient(0, -h / 2, 0, h / 2);
            frameGrad.addColorStop(0, '#444');
            frameGrad.addColorStop(0.5, '#111');
            frameGrad.addColorStop(1, '#000');
            ctx.fillStyle = frameGrad;
            ctx.beginPath();
            ctx.roundRect(-w / 2, -h / 2, w, h, 6);
            ctx.fill();

            // Bridge
            ctx.fillRect(-eyeDist * 0.15, -h * 0.15, eyeDist * 0.3, h * 0.3);

            // 3D Temples receding backwards
            const templeGradL = ctx.createLinearGradient(-w / 2, 0, -w / 2 - eyeDist * 0.4, 0);
            templeGradL.addColorStop(0, '#222'); templeGradL.addColorStop(1, '#050505');
            ctx.fillStyle = templeGradL;
            ctx.fillRect(-w / 2 - eyeDist * 0.4, -h * 0.1, eyeDist * 0.42, h * 0.2);

            const templeGradR = ctx.createLinearGradient(w / 2, 0, w / 2 + eyeDist * 0.4, 0);
            templeGradR.addColorStop(0, '#222'); templeGradR.addColorStop(1, '#050505');
            ctx.fillStyle = templeGradR;
            ctx.fillRect(w / 2, -h * 0.1, eyeDist * 0.4, h * 0.2);

            ctx.shadowBlur = 0;

            // 3D Lenses with deep reflection
            [-eyeDist * 0.7, eyeDist * 0.7].forEach(lx => {
                const lensGrad = ctx.createRadialGradient(lx, -h * 0.1, 1, lx, 0, eyeDist * 0.8);
                lensGrad.addColorStop(0, 'rgba(50,50,50,0.9)');
                lensGrad.addColorStop(1, 'rgba(0,0,0,0.95)');
                ctx.fillStyle = lensGrad;
                ctx.beginPath(); ctx.roundRect(lx - eyeDist * 0.55, -h * 0.45, eyeDist * 1.1, h * 0.9, 5); ctx.fill();

                // Specular Glass Shine
                const shine = ctx.createLinearGradient(lx - eyeDist * 0.4, -h * 0.4, lx + eyeDist * 0.2, h * 0.2);
                shine.addColorStop(0, 'rgba(255,255,255,0.4)');
                shine.addColorStop(0.3, 'rgba(255,255,255,0.05)');
                shine.addColorStop(1, 'transparent');
                ctx.fillStyle = shine;
                ctx.beginPath(); ctx.roundRect(lx - eyeDist * 0.55, -h * 0.45, eyeDist * 1.1, h * 0.9, 5); ctx.fill();
            });

            ctx.restore();
        }

        // ─── 3. SPIDER ─────────────────────────────────────────────────────────────

        function drawSpider(x, y, scale, time, hasWeb = false, angle = 0) {
            if (hasWeb) {
                const webGrad = ctx.createLinearGradient(x, 0, x, y);
                webGrad.addColorStop(0, 'rgba(255,255,255,0.8)');
                webGrad.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.strokeStyle = webGrad;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, y); ctx.stroke();
            }

            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            // 3D Drop Shadow for Depth
            ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
            ctx.shadowBlur = 20 * scale;
            ctx.shadowOffsetY = 15 * scale;

            // Body (bulbous 3D gradient)
            const bodyGrad = ctx.createRadialGradient(-4 * scale, -6 * scale, 1, 0, 0, 16 * scale);
            bodyGrad.addColorStop(0, '#555');
            bodyGrad.addColorStop(1, '#050505');
            ctx.fillStyle = bodyGrad;
            ctx.beginPath(); ctx.ellipse(0, 0, 12 * scale, 18 * scale, 0, 0, Math.PI * 2); ctx.fill();

            // Head
            const headGrad = ctx.createRadialGradient(-2 * scale, -20 * scale, 1, 0, -18 * scale, 9 * scale);
            headGrad.addColorStop(0, '#666');
            headGrad.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = headGrad;
            ctx.beginPath(); ctx.ellipse(0, -18 * scale, 9 * scale, 10 * scale, 0, 0, Math.PI * 2); ctx.fill();

            // Hourglass
            ctx.shadowBlur = 10; ctx.shadowColor = '#ff0000';
            ctx.fillStyle = '#ff0000';
            ctx.beginPath(); ctx.ellipse(0, 0, 4 * scale, 6 * scale, 0, 0, Math.PI * 2); ctx.fill();

            // Glowing Eyes
            ctx.shadowBlur = 8; ctx.shadowColor = '#ff3333';
            ctx.fillStyle = '#ff3333';
            for (let e = -1; e <= 1; e += 2) {
                ctx.beginPath(); ctx.arc(e * 5 * scale, -22 * scale, 2.5 * scale, 0, Math.PI * 2); ctx.fill();
            }

            // Legs with 3D joint shading
            ctx.shadowBlur = 10 * scale;
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowOffsetY = 10 * scale;
            ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            for (let i = 0; i < 4; i++) {
                const sweep = Math.sin(time * 5 + i * 0.8) * 10 * scale;
                const ld = (i + 1) * 7 * scale;
                [-1, 1].forEach(side => {
                    // Main dark leg
                    ctx.strokeStyle = '#111'; ctx.lineWidth = 3.5 * scale;
                    ctx.beginPath();
                    ctx.moveTo(0, -5 * scale + i * 4 * scale);
                    const j1x = side * (18 + ld * 0.5) * scale;
                    const j1y = -25 * scale + i * 5 * scale + sweep;
                    const j2x = side * (40 + ld) * scale;
                    const j2y = 15 * scale + i * 4 * scale - sweep;
                    ctx.quadraticCurveTo(j1x, j1y, j2x, j2y);
                    ctx.stroke();

                    // Specular leg highlight for 3D realism
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1 * scale;
                    ctx.stroke();
                });
            }
            ctx.restore();
        }

        const SPIDER_FACE_OUTLINE = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
        const SPIDER_NOSE_PATH = [8, 168, 6, 197, 195, 5, 4, 1, 19, 94, 2, 164, 0, 11, 12, 13, 14, 15, 16, 17, 18, 200, 199, 175, 152];
        const SPIDER_EYE_PATH = [33, 7, 163, 144, 145, 153, 154, 155, 133];

        function getSpiderPathPoint(lm, indices, t, closed = false) {
            const numSegments = closed ? indices.length : indices.length - 1;
            const scaledT = (t % 1) * numSegments;
            const index = Math.floor(scaledT);
            const nextIndex = closed ? (index + 1) % indices.length : Math.min(index + 1, indices.length - 1);
            const segmentT = scaledT - index;

            const p1 = getPoint(lm[indices[index]]);
            const p2 = getPoint(lm[indices[nextIndex]]);

            return {
                x: p1.x + (p2.x - p1.x) * segmentT,
                y: p1.y + (p2.y - p1.y) * segmentT
            };
        }

        function getSpiderBounceT(t) {
            const mod = t % 2;
            return mod > 1 ? 2 - mod : mod;
        }

        function drawSpiderFilter(landmarks) {
            const time = Date.now() * 0.003;
            spiderOffset += 1;
            if (spiderOffset > canvas.height) spiderOffset = 0;

            // Subtle 3D background web overlay
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath(); ctx.arc(canvas.width / 2, canvas.height / 2, i * 50 + (spiderOffset % 50), 0, Math.PI * 2); ctx.stroke();
            }

            const hangY = (Math.sin(time) * 50) + 120;

            // Large 3D spiders hanging from the ceiling
            drawSpider(120, hangY, 1.8, time, true);
            drawSpider(canvas.width - 120, hangY + 80, 1.5, time + 2, true);

            // Dynamic scale for face spiders
            const faceW = Math.hypot(getPoint(landmarks[454]).x - getPoint(landmarks[234]).x, getPoint(landmarks[454]).y - getPoint(landmarks[234]).y);
            const sc = faceW / 300;

            // Spider 1: Crawling around the entire outline of the face
            const t1 = (Date.now() % 10000) / 10000;
            const pos1A = getSpiderPathPoint(landmarks, SPIDER_FACE_OUTLINE, t1, true);
            const pos1B = getSpiderPathPoint(landmarks, SPIDER_FACE_OUTLINE, t1 + 0.01, true);
            const angle1 = Math.atan2(pos1B.y - pos1A.y, pos1B.x - pos1A.x) + Math.PI / 2;
            drawSpider(pos1A.x, pos1A.y, sc * 0.8, time * 2.5, false, angle1);

            // Spider 2: Crawling up and down the nose bridge
            const t2 = (Date.now() % 5000) / 5000;
            const actualT2 = getSpiderBounceT(t2);
            const nextT2 = getSpiderBounceT(t2 + 0.005);
            const pos2A = getSpiderPathPoint(landmarks, SPIDER_NOSE_PATH, actualT2, false);
            const pos2B = getSpiderPathPoint(landmarks, SPIDER_NOSE_PATH, nextT2, false);
            const angle2 = Math.atan2(pos2B.y - pos2A.y, pos2B.x - pos2A.x) + Math.PI / 2;
            drawSpider(pos2A.x, pos2A.y, sc * 0.7, time * 3, false, angle2);

            // Spider 3: Crawling back and forth under the left eye
            const t3 = (Date.now() % 3500) / 3500;
            const actualT3 = getSpiderBounceT(t3);
            const nextT3 = getSpiderBounceT(t3 + 0.01);
            const pos3A = getSpiderPathPoint(landmarks, SPIDER_EYE_PATH, actualT3, false);
            const pos3B = getSpiderPathPoint(landmarks, SPIDER_EYE_PATH, nextT3, false);
            const angle3 = Math.atan2(pos3B.y - pos3A.y, pos3B.x - pos3A.x) + Math.PI / 2;
            drawSpider(pos3A.x, pos3A.y, sc * 0.5, time * 4, false, angle3);
        }

        // ─── 4. MATRIX ─────────────────────────────────────────────────────────────

        const MATRIX_CHARS = '0123456789ABCDEF∆ΩΨΠΣΦ<>{}[]ｦｲｳｴｵ';

        function drawMatrix(lm) {
            const { nose, faceW, eyeDist } = getFaceMetrics(lm);

            // Rain trail
            ctx.fillStyle = 'rgba(0,0,0,0.12)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = 'bold 16px monospace';
            rainDrops.forEach(d => {
                const bright = Math.random() > 0.92;
                ctx.fillStyle = bright ? '#afffaf' : '#00cc44';
                ctx.shadowBlur = bright ? 12 : 0;
                ctx.shadowColor = '#00ff44';
                ctx.fillText(MATRIX_CHARS[Math.floor(Math.random() * MATRIX_CHARS.length)], d.x, d.y);
                d.y += d.speed;
                if (d.y > canvas.height) { d.y = 0; d.x = Math.random() * canvas.width; }
            });

            // 3D Face grid overlay
            ctx.strokeStyle = 'rgba(0,255,60,0.4)';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,255,60,0.9)';
            const gridIds = [10, 338, 297, 332, 284, 251, 389, 356, 454, 323, 361, 288, 397, 365, 379, 378, 400, 377, 152, 148, 176, 149, 150, 136, 172, 58, 132, 93, 234, 127, 162, 21, 54, 103, 67, 109];
            ctx.beginPath();
            gridIds.forEach((id, i) => {
                const p = getPoint(lm[id]);
                i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
            });
            ctx.closePath(); ctx.stroke();

            // 3D Glowing landmarks
            ctx.fillStyle = '#00ff44'; ctx.shadowBlur = 12; ctx.shadowColor = '#00ff44';
            [1, 33, 263, 152, 10, 234, 454].forEach(id => {
                const p = getPoint(lm[id]);
                ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
            });

            // Matrix text readout above face (Holographic depth)
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#b3ffb3';
            ctx.font = `bold ${Math.max(12, eyeDist * 0.25)}px monospace`;
            ctx.textAlign = 'center';
            const t = Date.now();
            ctx.fillText(
                `${String.fromCharCode(0x30A6)}${String.fromCharCode(0x30A8)}${String.fromCharCode(0x30A1)} ${((t % 999) / 10).toFixed(1)}`,
                nose.x, nose.y - faceW * 0.75
            );
            ctx.shadowBlur = 0;
        }

        // ─── 5. SKULL ──────────────────────────────────────────────────────────────

        function drawSkull(lm) {
            const { lEye, rEye, fore, chin, faceW, faceH, eyeDist, angle, cx, cy } = getFaceMetrics(lm);

            // Dark vignette
            const vg = ctx.createRadialGradient(cx, cy, faceW * 0.2, cx, cy, faceW * 1.1);
            vg.addColorStop(0, 'transparent'); vg.addColorStop(1, 'rgba(0,0,0,0.9)');
            ctx.fillStyle = vg; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3D Fire particles from eyes
            [lEye, rEye].forEach(eye => {
                if (particles.length < 150) {
                    particles.push({
                        x: eye.x + (Math.random() - 0.5) * eyeDist * 0.3,
                        y: eye.y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -(Math.random() * 4 + 2),
                        life: 1,
                        color: `hsl(${Math.random() * 40},100%,55%)`
                    });
                }
            });
            particles.forEach((p, i) => {
                ctx.globalCompositeOperation = 'screen';
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.life * eyeDist * 0.22, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,${Math.floor(p.life * 130)},0,${p.life * 0.8})`;
                ctx.shadowBlur = 10 * p.life; ctx.shadowColor = '#ff6600';
                ctx.fill();
                p.x += p.vx; p.y += p.vy; p.vy -= 0.1; p.life -= 0.035;
                if (p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);

            const lLocal = {
                x: (lEye.x - cx) * Math.cos(-angle) - (lEye.y - cy) * Math.sin(-angle),
                y: (lEye.x - cx) * Math.sin(-angle) + (lEye.y - cy) * Math.cos(-angle)
            };
            const rLocal = {
                x: (rEye.x - cx) * Math.cos(-angle) - (rEye.y - cy) * Math.sin(-angle),
                y: (rEye.x - cx) * Math.sin(-angle) + (rEye.y - cy) * Math.cos(-angle)
            };

            // 3D Deep Eye sockets
            const sockR = eyeDist * 0.38;
            [lLocal, rLocal].forEach(pt => {
                const innerShadow = ctx.createRadialGradient(pt.x, pt.y, sockR * 0.1, pt.x, pt.y, sockR);
                innerShadow.addColorStop(0, '#000');
                innerShadow.addColorStop(0.7, '#080808');
                innerShadow.addColorStop(1, '#1a1a1a');
                ctx.fillStyle = innerShadow;
                ctx.beginPath(); ctx.ellipse(pt.x, pt.y, sockR, sockR * 0.85, 0, 0, Math.PI * 2); ctx.fill();
                
                // 3D Bone Rim
                ctx.strokeStyle = 'rgba(80,80,80,0.5)'; ctx.lineWidth = 3;
                ctx.stroke();
            });

            // 3D Nose cavity
            const nLocal = {
                x: (getPoint(lm[1]).x - cx) * Math.cos(-angle) - (getPoint(lm[1]).y - cy) * Math.sin(-angle),
                y: (getPoint(lm[1]).x - cx) * Math.sin(-angle) + (getPoint(lm[1]).y - cy) * Math.cos(-angle)
            };
            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.moveTo(nLocal.x, nLocal.y - sockR * 0.3);
            ctx.lineTo(nLocal.x - sockR * 0.25, nLocal.y + sockR * 0.3);
            ctx.lineTo(nLocal.x + sockR * 0.25, nLocal.y + sockR * 0.3);
            ctx.closePath(); ctx.fill();

            // 3D Beveled Teeth
            const jawY = (getPoint(lm[152]).y - cy) * Math.cos(-angle) + (getPoint(lm[152]).x - cx) * Math.sin(-angle);
            const teethW = eyeDist * 1.6;
            const toothW = teethW / 7;
            for (let t = 0; t < 7; t++) {
                const tx = -teethW / 2 + t * toothW + toothW * 0.1;
                const toothGrad = ctx.createLinearGradient(tx, 0, tx + toothW * 0.8, 0);
                toothGrad.addColorStop(0, '#777');
                toothGrad.addColorStop(0.5, '#e8e8e0');
                toothGrad.addColorStop(1, '#444');
                ctx.fillStyle = toothGrad;
                ctx.shadowBlur = 6; ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.beginPath();
                ctx.roundRect(tx, jawY * 0.4, toothW * 0.8, sockR * 0.55, [3, 3, 6, 6]);
                ctx.fill();
            }

            ctx.restore();
            ctx.shadowBlur = 0;
        }

        // ─── 6. QUEEN ──────────────────────────────────────────────────────────────

        function drawQueen(lm) {
            const { fore, lCheek, rCheek, faceW, angle, cx, cy, eyeDist } = getFaceMetrics(lm);
            const w = eyeDist * 2.8;
            const time = Date.now() * 0.002;

            ctx.save();
            ctx.translate(fore.x, fore.y - eyeDist * 0.6);
            ctx.rotate(angle);

            // 3D Crown base band
            const baseGrad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
            baseGrad.addColorStop(0, '#A67C00');
            baseGrad.addColorStop(0.2, '#F5D061');
            baseGrad.addColorStop(0.5, '#E5A91A');
            baseGrad.addColorStop(0.8, '#FFEA99');
            baseGrad.addColorStop(1, '#8C6700');
            ctx.fillStyle = baseGrad;
            ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 15; ctx.shadowOffsetY = 8;
            ctx.beginPath();
            ctx.roundRect(-w / 2, -eyeDist * 0.22, w, eyeDist * 0.44, 4);
            ctx.fill();
            
            // Base Band Bevel Edge
            ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 2;
            ctx.stroke();

            // 3D Crown spikes
            const spikes = [-w / 3, 0, w / 3];
            const heights = [0.55, 0.75, 0.55];
            spikes.forEach((sx, i) => {
                // Cylindrical 3D gradient for each spike
                const spikeGrad = ctx.createLinearGradient(sx - w * 0.12, 0, sx + w * 0.12, 0);
                spikeGrad.addColorStop(0, '#A67C00');
                spikeGrad.addColorStop(0.3, '#FFF0A0');
                spikeGrad.addColorStop(0.7, '#D49A00');
                spikeGrad.addColorStop(1, '#735500');
                ctx.fillStyle = spikeGrad;
                ctx.shadowBlur = 5; ctx.shadowOffsetY = 3;
                ctx.beginPath();
                ctx.moveTo(sx - w * 0.12, -eyeDist * 0.22);
                ctx.lineTo(sx, -eyeDist * heights[i]);
                ctx.lineTo(sx + w * 0.12, -eyeDist * 0.22);
                ctx.closePath(); ctx.fill();
                
                // 3D Gemstone on each spike tip
                const gemColors = ['rgba(100,200,255,0.95)', 'rgba(255,100,100,0.95)', 'rgba(100,255,150,0.95)'];
                const gemGlow = ['#00aaff', '#ff0000', '#00ff55'];
                ctx.fillStyle = gemColors[i];
                ctx.shadowColor = gemGlow[i]; ctx.shadowBlur = 25; ctx.shadowOffsetY = 0;
                ctx.beginPath(); ctx.arc(sx, -eyeDist * heights[i] + 8, eyeDist * 0.08, 0, Math.PI * 2); ctx.fill();
                // Gem specular shine
                ctx.fillStyle = 'rgba(255,255,255,0.8)';
                ctx.shadowBlur = 0;
                ctx.beginPath(); ctx.arc(sx - 3, -eyeDist * heights[i] + 5, 2.5, 0, Math.PI * 2); ctx.fill();
            });

            ctx.restore();
            ctx.shadowBlur = 0;

            // 3D Glitter particles
            if (Math.random() > 0.65) {
                particles.push({
                    x: fore.x + (Math.random() - 0.5) * w * 1.8,
                    y: fore.y - eyeDist * (0.6 + Math.random() * 0.8),
                    life: 1, size: Math.random() * 4 + 2,
                    vx: (Math.random() - 0.5) * 1.5, vy: -Math.random() * 0.8
                });
            }
            ctx.shadowBlur = 10; ctx.shadowColor = 'white';
            particles.forEach((p, i) => {
                const ptGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                ptGrad.addColorStop(0, 'white');
                ptGrad.addColorStop(1, `rgba(255,215,0,${p.life})`);
                ctx.fillStyle = ptGrad;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                p.x += p.vx; p.y += p.vy; p.life -= 0.04;
                if (p.life <= 0) particles.splice(i, 1);
            });
            ctx.shadowBlur = 0;
        }

        // ─── 7. CAT ────────────────────────────────────────────────────────────────

        function drawCat(landmarks) {
            // Soft Pink Vignette
            const grad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 300, canvas.width / 2, canvas.height / 2, 800);
            grad.addColorStop(0, "transparent"); grad.addColorStop(1, "rgba(255, 182, 193, 0.4)");
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

            const fore = getPoint(landmarks[10]);
            const w = Math.hypot(getPoint(landmarks[234]).x - getPoint(landmarks[454]).x, getPoint(landmarks[234]).y - getPoint(landmarks[454]).y);
            const nose = getPoint(landmarks[1]);

            // Ears (3D Curved)
            ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowOffsetY = 6;
            ctx.strokeStyle = "#222"; ctx.lineWidth = 2;

            // Left Ear
            const lEarGrad = ctx.createLinearGradient(fore.x - w * 0.3, fore.y, fore.x - w * 0.6, fore.y - w * 0.8);
            lEarGrad.addColorStop(0, '#444'); lEarGrad.addColorStop(1, '#111');
            ctx.fillStyle = lEarGrad;
            ctx.beginPath();
            ctx.moveTo(fore.x - w * 0.2, fore.y);
            ctx.quadraticCurveTo(fore.x - w * 0.6, fore.y - w * 0.8, fore.x - w * 0.5, fore.y);
            ctx.fill(); ctx.stroke();
            
            // Inner Pink (3D deep shadow)
            ctx.shadowBlur = 0;
            const lInnerGrad = ctx.createRadialGradient(fore.x - w * 0.4, fore.y - 10, 2, fore.x - w * 0.45, fore.y - w * 0.4, w * 0.3);
            lInnerGrad.addColorStop(0, '#ff99aa'); lInnerGrad.addColorStop(1, '#882233');
            ctx.fillStyle = lInnerGrad;
            ctx.beginPath();
            ctx.moveTo(fore.x - w * 0.25, fore.y - 10);
            ctx.quadraticCurveTo(fore.x - w * 0.5, fore.y - w * 0.6, fore.x - w * 0.45, fore.y - 10);
            ctx.fill();

            // Right Ear
            ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowOffsetY = 6;
            const rEarGrad = ctx.createLinearGradient(fore.x + w * 0.3, fore.y, fore.x + w * 0.6, fore.y - w * 0.8);
            rEarGrad.addColorStop(0, '#444'); rEarGrad.addColorStop(1, '#111');
            ctx.fillStyle = rEarGrad;
            ctx.beginPath();
            ctx.moveTo(fore.x + w * 0.2, fore.y);
            ctx.quadraticCurveTo(fore.x + w * 0.6, fore.y - w * 0.8, fore.x + w * 0.5, fore.y);
            ctx.fill(); ctx.stroke();
            
            // Inner Pink
            ctx.shadowBlur = 0;
            const rInnerGrad = ctx.createRadialGradient(fore.x + w * 0.4, fore.y - 10, 2, fore.x + w * 0.45, fore.y - w * 0.4, w * 0.3);
            rInnerGrad.addColorStop(0, '#ff99aa'); rInnerGrad.addColorStop(1, '#882233');
            ctx.fillStyle = rInnerGrad;
            ctx.beginPath();
            ctx.moveTo(fore.x + w * 0.25, fore.y - 10);
            ctx.quadraticCurveTo(fore.x + w * 0.5, fore.y - w * 0.6, fore.x + w * 0.45, fore.y - 10);
            ctx.fill();

            // 3D Cute Nose
            ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 5;
            const noseGrad = ctx.createRadialGradient(nose.x, nose.y - 6, 2, nose.x, nose.y, 18);
            noseGrad.addColorStop(0, '#666'); noseGrad.addColorStop(0.5, '#222'); noseGrad.addColorStop(1, '#000');
            ctx.fillStyle = noseGrad;
            ctx.beginPath(); ctx.ellipse(nose.x, nose.y, 18, 12, 0, 0, Math.PI * 2); ctx.fill();
            
            // Specular Shine
            ctx.shadowBlur = 0;
            ctx.fillStyle = "rgba(255,255,255,0.85)";
            ctx.beginPath(); ctx.ellipse(nose.x - 5, nose.y - 4, 6, 3, -0.3, 0, Math.PI * 2); ctx.fill();

            // Whiskers (Fading out with drop shadow)
            ctx.lineWidth = 2.5;
            ctx.shadowBlur = 4; ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowOffsetY = 2;
            const gradW = ctx.createLinearGradient(nose.x, nose.y, nose.x - 150, nose.y);
            gradW.addColorStop(0, "white"); gradW.addColorStop(1, "transparent");
            ctx.strokeStyle = gradW;

            ctx.beginPath(); ctx.moveTo(nose.x - 22, nose.y); ctx.lineTo(nose.x - 150, nose.y - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(nose.x - 22, nose.y + 10); ctx.lineTo(nose.x - 140, nose.y + 30); ctx.stroke();

            const gradW2 = ctx.createLinearGradient(nose.x, nose.y, nose.x + 150, nose.y);
            gradW2.addColorStop(0, "white"); gradW2.addColorStop(1, "transparent");
            ctx.strokeStyle = gradW2;
            ctx.beginPath(); ctx.moveTo(nose.x + 22, nose.y); ctx.lineTo(nose.x + 150, nose.y - 20); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(nose.x + 22, nose.y + 10); ctx.lineTo(nose.x + 140, nose.y + 30); ctx.stroke();
            ctx.shadowBlur = 0;
        }

        // ─── 8. DOG ────────────────────────────────────────────────────────────────

        function drawDog(lm, blendshapes) {
            const { fore, nose, chin, lCheek, rCheek, faceW, eyeDist, angle } = getFaceMetrics(lm);
            const lEarBase = getPoint(lm[127]);
            const rEarBase = getPoint(lm[356]);
            const sway = (nose.x - canvas.width / 2) * 0.12;
            const earLen = faceW * 0.85;

            // Floppy ears with head rotation
            ctx.save();
            ctx.strokeStyle = '#3d2510'; ctx.lineWidth = 3;

            // 3D Left ear
            ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 10;
            const lEarGrad = ctx.createLinearGradient(lEarBase.x, lEarBase.y, lEarBase.x - earLen * 0.6 + sway, lEarBase.y + earLen * 0.9);
            lEarGrad.addColorStop(0, '#A67B5B'); lEarGrad.addColorStop(1, '#5B3A21');
            ctx.fillStyle = lEarGrad;
            ctx.beginPath();
            ctx.moveTo(lEarBase.x, lEarBase.y - eyeDist * 0.3);
            ctx.bezierCurveTo(
                lEarBase.x - earLen + sway, lEarBase.y,
                lEarBase.x - earLen * 0.6 + sway, lEarBase.y + earLen * 0.9,
                lEarBase.x + eyeDist * 0.25, lEarBase.y + eyeDist * 0.3
            );
            ctx.fill(); ctx.stroke();
            
            // Inner ear (deep cavity)
            ctx.shadowBlur = 0;
            const lInnerGrad = ctx.createRadialGradient(lEarBase.x - earLen * 0.4 + sway, lEarBase.y + earLen * 0.4, 5, lEarBase.x - earLen * 0.4 + sway, lEarBase.y + earLen * 0.4, earLen * 0.6);
            lInnerGrad.addColorStop(0, '#3a1f11'); lInnerGrad.addColorStop(1, '#6b3a1f');
            ctx.fillStyle = lInnerGrad;
            ctx.beginPath();
            ctx.moveTo(lEarBase.x - eyeDist * 0.1, lEarBase.y);
            ctx.bezierCurveTo(
                lEarBase.x - earLen * 0.7 + sway, lEarBase.y + eyeDist * 0.2,
                lEarBase.x - earLen * 0.5 + sway, lEarBase.y + earLen * 0.7,
                lEarBase.x + eyeDist * 0.1, lEarBase.y + eyeDist * 0.2
            );
            ctx.fill();

            // 3D Right ear
            ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 10;
            const rEarGrad = ctx.createLinearGradient(rEarBase.x, rEarBase.y, rEarBase.x + earLen * 0.6 + sway, rEarBase.y + earLen * 0.9);
            rEarGrad.addColorStop(0, '#A67B5B'); rEarGrad.addColorStop(1, '#5B3A21');
            ctx.fillStyle = rEarGrad;
            ctx.beginPath();
            ctx.moveTo(rEarBase.x, rEarBase.y - eyeDist * 0.3);
            ctx.bezierCurveTo(
                rEarBase.x + earLen + sway, rEarBase.y,
                rEarBase.x + earLen * 0.6 + sway, rEarBase.y + earLen * 0.9,
                rEarBase.x - eyeDist * 0.25, rEarBase.y + eyeDist * 0.3
            );
            ctx.fill(); ctx.stroke();
            
            ctx.shadowBlur = 0;
            const rInnerGrad = ctx.createRadialGradient(rEarBase.x + earLen * 0.4 + sway, rEarBase.y + earLen * 0.4, 5, rEarBase.x + earLen * 0.4 + sway, rEarBase.y + earLen * 0.4, earLen * 0.6);
            rInnerGrad.addColorStop(0, '#3a1f11'); rInnerGrad.addColorStop(1, '#6b3a1f');
            ctx.fillStyle = rInnerGrad;
            ctx.beginPath();
            ctx.moveTo(rEarBase.x + eyeDist * 0.1, rEarBase.y);
            ctx.bezierCurveTo(
                rEarBase.x + earLen * 0.7 + sway, rEarBase.y + eyeDist * 0.2,
                rEarBase.x + earLen * 0.5 + sway, rEarBase.y + earLen * 0.7,
                rEarBase.x - eyeDist * 0.1, rEarBase.y + eyeDist * 0.2
            );
            ctx.fill();

            ctx.restore();

            // 3D Dog nose — properly scaled bulbous look
            const noseR = eyeDist * 0.22;
            ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowOffsetY = 6;
            const noseGrad = ctx.createRadialGradient(nose.x, nose.y - noseR * 0.3, 1, nose.x, nose.y, noseR);
            noseGrad.addColorStop(0, '#444'); noseGrad.addColorStop(0.5, '#111'); noseGrad.addColorStop(1, '#000');
            ctx.fillStyle = noseGrad;
            ctx.beginPath(); ctx.ellipse(nose.x, nose.y, noseR, noseR * 0.7, 0, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            
            // Nostrils
            ctx.fillStyle = '#050505';
            ctx.beginPath(); ctx.ellipse(nose.x - noseR * 0.38, nose.y + noseR * 0.18, noseR * 0.22, noseR * 0.18, -0.3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(nose.x + noseR * 0.38, nose.y + noseR * 0.18, noseR * 0.22, noseR * 0.18, 0.3, 0, Math.PI * 2); ctx.fill();
            
            // Specular shine
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath(); ctx.ellipse(nose.x - noseR * 0.2, nose.y - noseR * 0.15, noseR * 0.25, noseR * 0.15, -0.5, 0, Math.PI * 2); ctx.fill();

            // 3D Tongue — blendshape driven
            const openScore = blendshapes.categories.find(c => c.categoryName === 'jawOpen')?.score || 0;
            if (openScore > 0.12) {
                const tLen = openScore * eyeDist * 1.6;
                const tW = eyeDist * 0.28;
                
                // Cylindrical shading
                const tongueGrad = ctx.createLinearGradient(chin.x - tW, 0, chin.x + tW, 0);
                tongueGrad.addColorStop(0, '#a02040');
                tongueGrad.addColorStop(0.5, '#ff6688');
                tongueGrad.addColorStop(1, '#a02040');
                
                ctx.fillStyle = tongueGrad;
                ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 5;
                ctx.beginPath();
                ctx.moveTo(chin.x - tW, chin.y);
                ctx.bezierCurveTo(chin.x - tW * 1.2, chin.y + tLen * 0.5, chin.x - tW * 0.9, chin.y + tLen, chin.x, chin.y + tLen);
                ctx.bezierCurveTo(chin.x + tW * 0.9, chin.y + tLen, chin.x + tW * 1.2, chin.y + tLen * 0.5, chin.x + tW, chin.y);
                ctx.closePath(); ctx.fill();
                ctx.shadowBlur = 0;
                
                // Tongue groove
                ctx.strokeStyle = 'rgba(120,10,30,0.8)'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(chin.x, chin.y + 5); ctx.lineTo(chin.x, chin.y + tLen - 10); ctx.stroke();
                
                // Specular tongue shine
                ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1.5;
                ctx.beginPath(); ctx.moveTo(chin.x - tW * 0.4, chin.y + 10); ctx.lineTo(chin.x - tW * 0.4, chin.y + tLen - 15); ctx.stroke();
                
                // Drool
                if (openScore > 0.4) {
                    ctx.strokeStyle = 'rgba(150,200,255,0.6)'; ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(chin.x + tW * 0.3, chin.y + tLen - 5);
                    ctx.quadraticCurveTo(chin.x + tW * 0.4, chin.y + tLen + eyeDist * 0.3, chin.x + tW * 0.2, chin.y + tLen + eyeDist * 0.55);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.8)';
                    ctx.beginPath(); ctx.arc(chin.x + tW * 0.2, chin.y + tLen + eyeDist * 0.55, 2, 0, Math.PI*2); ctx.fill();
                }
            }

            // Cheek spots
            [lCheek, rCheek].forEach(c => {
                const sg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, eyeDist * 0.35);
                sg.addColorStop(0, 'rgba(180,120,80,0.3)'); sg.addColorStop(1, 'transparent');
                ctx.fillStyle = sg;
                ctx.beginPath(); ctx.ellipse(c.x, c.y, eyeDist * 0.35, eyeDist * 0.22, 0, 0, Math.PI * 2); ctx.fill();
            });
        }

        // ─── 9. LOVE ───────────────────────────────────────────────────────────────

        function drawLove(lm) {
            const { nose, lCheek, rCheek, fore, faceW, eyeDist, cx, cy } = getFaceMetrics(lm);

            // Pink vignette
            const vg = ctx.createRadialGradient(cx, cy, faceW * 0.15, cx, cy, faceW * 1.1);
            vg.addColorStop(0, 'transparent'); vg.addColorStop(1, 'rgba(255,80,120,0.28)');
            ctx.fillStyle = vg; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3D Balloon Cheek hearts
            [lCheek, rCheek].forEach(c => {
                const heartGrad = ctx.createRadialGradient(c.x - eyeDist * 0.25, c.y - eyeDist * 0.22, 2, c.x - eyeDist * 0.22, c.y - eyeDist * 0.18, eyeDist * 0.28);
                heartGrad.addColorStop(0, '#ff99cc');
                heartGrad.addColorStop(0.4, '#ff3366');
                heartGrad.addColorStop(1, '#990033');
                ctx.fillStyle = heartGrad;
                ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowOffsetY = 6;
                drawHeart(c.x - eyeDist * 0.22, c.y - eyeDist * 0.18, eyeDist * 0.22);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // 3D Floating balloon heart particles
            if (Math.random() > 0.88) {
                particles.push({
                    x: nose.x + (Math.random() - 0.5) * eyeDist * 1.5,
                    y: nose.y,
                    vy: 1.5 + Math.random() * 1.5,
                    vx: (Math.random() - 0.5) * 1,
                    life: 1,
                    size: eyeDist * (0.08 + Math.random() * 0.1)
                });
            }
            particles.forEach((p, i) => {
                ctx.globalAlpha = p.life * 0.9;
                
                const ptGrad = ctx.createRadialGradient(p.x - p.size*1.2, p.y - p.size*1.2, 1, p.x - p.size, p.y - p.size, p.size*1.5);
                ptGrad.addColorStop(0, '#ffccdd');
                ptGrad.addColorStop(0.5, '#ff4d79');
                ptGrad.addColorStop(1, '#cc0044');
                ctx.fillStyle = ptGrad;
                
                ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(0,0,0,0.3)'; ctx.shadowOffsetY = 4;
                drawHeart(p.x - p.size, p.y - p.size, p.size);
                ctx.fill();
                p.x += p.vx; p.y -= p.vy; p.life -= 0.012;
                if (p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;

            // 3D Balloon Heart crown above head
            const hs = eyeDist * 0.18;
            [-eyeDist * 0.6, 0, eyeDist * 0.6].forEach((ox, i) => {
                const sz = i === 1 ? hs * 1.3 : hs;
                const hx = fore.x + ox - sz;
                const hy = fore.y - eyeDist * 0.65 - sz * 1.5;
                
                const crGrad = ctx.createRadialGradient(hx - sz*0.2, hy - sz*0.2, 2, hx, hy, sz*1.5);
                crGrad.addColorStop(0, '#ffb3cc');
                crGrad.addColorStop(0.5, '#ff1a53');
                crGrad.addColorStop(1, '#b3003b');
                ctx.fillStyle = crGrad;
                
                ctx.shadowBlur = 15; ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowOffsetY = 8;
                drawHeart(hx, hy, sz);
                ctx.fill();
                
                // Extra balloon specular shine
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.shadowBlur = 0;
                ctx.beginPath(); ctx.ellipse(hx - sz*0.4, hy + sz*0.2, sz*0.3, sz*0.15, -0.5, 0, Math.PI*2); ctx.fill();
            });
            ctx.shadowBlur = 0;
        }

        // ─── 10. DEVIL ─────────────────────────────────────────────────────────────

        function drawDevil(lm) {
            const { fore, lEye, rEye, nose, lCheek, rCheek, faceW, eyeDist, angle, cx, cy } = getFaceMetrics(lm);
            const time = Date.now() * 0.002;

            // Red gradient atmosphere
            const atmo = ctx.createRadialGradient(cx, cy, faceW * 0.1, cx, cy, faceW * 1.2);
            atmo.addColorStop(0, 'rgba(60,0,0,0.3)'); atmo.addColorStop(1, 'rgba(0,0,0,0.85)');
            ctx.fillStyle = atmo; ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Horns — rotation-corrected
            ctx.save();
            ctx.translate(fore.x, fore.y);
            ctx.rotate(angle);

            // 3D Cylindrical Shading for Horns
            const lHornGrad = ctx.createLinearGradient(-eyeDist * 0.3, 0, -eyeDist * 1.0, -eyeDist * 1.0);
            lHornGrad.addColorStop(0, '#550000');
            lHornGrad.addColorStop(0.3, '#ff1a1a');
            lHornGrad.addColorStop(0.7, '#990000');
            lHornGrad.addColorStop(1, '#220000');
            
            const rHornGrad = ctx.createLinearGradient(eyeDist * 0.3, 0, eyeDist * 1.0, -eyeDist * 1.0);
            rHornGrad.addColorStop(0, '#550000');
            rHornGrad.addColorStop(0.3, '#ff1a1a');
            rHornGrad.addColorStop(0.7, '#990000');
            rHornGrad.addColorStop(1, '#220000');

            ctx.shadowBlur = 25; ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowOffsetY = 15;

            // Left horn
            ctx.fillStyle = lHornGrad;
            ctx.beginPath();
            ctx.moveTo(-eyeDist * 0.6, 0);
            ctx.bezierCurveTo(-eyeDist * 1.4, -eyeDist * 0.4, -eyeDist * 1.5, -eyeDist * 1.1, -eyeDist * 0.85, -eyeDist * 1.5);
            ctx.bezierCurveTo(-eyeDist * 0.7, -eyeDist * 1.1, -eyeDist * 0.55, -eyeDist * 0.5, -eyeDist * 0.3, 0);
            ctx.closePath(); ctx.fill();

            // Right horn
            ctx.fillStyle = rHornGrad;
            ctx.beginPath();
            ctx.moveTo(eyeDist * 0.6, 0);
            ctx.bezierCurveTo(eyeDist * 1.4, -eyeDist * 0.4, eyeDist * 1.5, -eyeDist * 1.1, eyeDist * 0.85, -eyeDist * 1.5);
            ctx.bezierCurveTo(eyeDist * 0.7, -eyeDist * 1.1, eyeDist * 0.55, -eyeDist * 0.5, eyeDist * 0.3, 0);
            ctx.closePath(); ctx.fill();

            // 3D Specular Horn highlights
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,150,150,0.6)';
            
            // Left Specular
            ctx.beginPath();
            ctx.moveTo(-eyeDist * 0.55, -eyeDist * 0.1);
            ctx.bezierCurveTo(-eyeDist * 1.1, -eyeDist * 0.5, -eyeDist * 1.1, -eyeDist * 0.9, -eyeDist * 0.85, -eyeDist * 1.45);
            ctx.bezierCurveTo(-eyeDist * 0.8, -eyeDist * 0.9, -eyeDist * 0.7, -eyeDist * 0.5, -eyeDist * 0.48, -eyeDist * 0.1);
            ctx.closePath(); ctx.fill();
            
            // Right Specular
            ctx.beginPath();
            ctx.moveTo(eyeDist * 0.55, -eyeDist * 0.1);
            ctx.bezierCurveTo(eyeDist * 1.1, -eyeDist * 0.5, eyeDist * 1.1, -eyeDist * 0.9, eyeDist * 0.85, -eyeDist * 1.45);
            ctx.bezierCurveTo(eyeDist * 0.8, -eyeDist * 0.9, eyeDist * 0.7, -eyeDist * 0.5, eyeDist * 0.48, -eyeDist * 0.1);
            ctx.closePath(); ctx.fill();

            ctx.restore();

            // 3D Eye glow (deep socket effect)
            [lEye, rEye].forEach(eye => {
                const eg = ctx.createRadialGradient(eye.x, eye.y, 0, eye.x, eye.y, eyeDist * 0.5);
                eg.addColorStop(0, '#ff0000');
                eg.addColorStop(0.3, 'rgba(200,0,0,0.8)');
                eg.addColorStop(1, 'transparent');
                ctx.fillStyle = eg;
                ctx.beginPath(); ctx.ellipse(eye.x, eye.y, eyeDist * 0.45, eyeDist * 0.3, 0, 0, Math.PI * 2); ctx.fill();
                
                // Intense bright core
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10; ctx.shadowColor = 'red';
                ctx.beginPath(); ctx.arc(eye.x, eye.y, 4, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 3D Ember particles rising
            if (particles.length < 80) {
                particles.push({
                    x: cx + (Math.random() - 0.5) * faceW * 0.8,
                    y: fore.y + eyeDist * 0.3,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: -(Math.random() * 3 + 1),
                    life: 1,
                    size: Math.random() * 4 + 2
                });
            }
            particles.forEach((p, i) => {
                ctx.globalAlpha = p.life * 0.8;
                const ptGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * p.life);
                ptGrad.addColorStop(0, '#fff');
                ptGrad.addColorStop(0.4, `hsl(${Math.random() * 30},100%,${40 + p.life * 30}%)`);
                ptGrad.addColorStop(1, 'rgba(255,0,0,0)');
                ctx.fillStyle = ptGrad;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
                p.x += p.vx + Math.sin(p.y * 0.05) * 0.5; p.y += p.vy; p.life -= 0.025;
                if (p.life <= 0) particles.splice(i, 1);
            });
            ctx.globalAlpha = 1;
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (faceLandmarker && video.currentTime > 0) {
                const results = faceLandmarker.detectForVideo(video, performance.now());
                if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                    const lm = results.faceLandmarks[0];
                    const bs = results.faceBlendshapes[0]; // Needed for Dog/Iron

                    if (activeFilter === 'iron') drawIron(lm);
                    else if (activeFilter === 'thug') drawThug(lm);
                    else if (activeFilter === 'spider') drawSpiderFilter(lm);
                    else if (activeFilter === 'matrix') drawMatrix(lm);
                    else if (activeFilter === 'skull') drawSkull(lm);

                    else if (activeFilter === 'queen') drawQueen(lm);
                    else if (activeFilter === 'cat') drawCat(lm);
                    else if (activeFilter === 'dog') drawDog(lm, bs);
                    else if (activeFilter === 'love') drawLove(lm);
                    else if (activeFilter === 'devil') drawDevil(lm);
                }
            }
            requestAnimationFrame(renderLoop);
        }

        window.addEventListener('beforeunload', () => {
            const v = document.getElementById('webcam-bg');
            if (v && v.srcObject) {
                v.srcObject.getTracks().forEach(t => t.stop());
            }
        });

        init();
    </script>
</body>
