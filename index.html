<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceVerse - Neural AI Suite</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        /* --- BASE VARIABLES --- */
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.05); /* Dark Glass */
            --card-border: rgba(255, 255, 255, 0.15);
            --card-hover: rgba(255, 255, 255, 0.1);
            --accent-color: #00ffcc; /* Cyan default */
            --subtitle-color: rgba(255, 255, 255, 0.6);
        }

        [data-theme="light"] {
            --bg-color: #f4f4f9;
            --text-color: #1a1a1a; /* Dark text for light mode */
            --card-bg: rgba(255, 255, 255, 0.6); /* Light Glass */
            --card-border: rgba(0, 0, 0, 0.1);
            --card-hover: rgba(255, 255, 255, 0.9);
            --accent-color: #00b894;
            --subtitle-color: #555;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            overflow: hidden; /* No scroll for immersive feel */
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ANIMATION CANVAS */
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* MAIN LAYOUT */
        .container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* TEXT ANIMATION KEYFRAMES */
        @keyframes bounceIn {
            0% { opacity: 0; transform: translateY(-100px); }
            60% { opacity: 1; transform: translateY(20px); }
            80% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* HERO TITLE */
        .hero h1 {
            font-size: 6rem;
            margin: 0;
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: -2px;
            
            /* UPDATED GRADIENT: Uses --text-color variable so it adapts to light/dark mode */
            background: linear-gradient(to right, var(--text-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 30px rgba(0,255,204,0.3));
            
            /* ADDED ANIMATION */
            animation: bounceIn 1.2s cubic-bezier(0.215, 0.610, 0.355, 1.000) both;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--subtitle-color);
            letter-spacing: 4px;
            margin-top: 10px;
            text-transform: uppercase;
            font-weight: 700;
            /* Subtle fade in for subtitle */
            animation: fadeIn 1.5s ease-out forwards;
            animation-delay: 0.5s; /* Wait for title */
            opacity: 0; /* Start hidden */
        }

        /* CARDS GRID */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-top: 60px;
            width: 85%;
            max-width: 1200px;
            
            /* Fade in cards */
            animation: fadeIn 1.5s ease-out forwards;
            animation-delay: 0.8s;
            opacity: 0;
        }

        /* GLASS CARDS (Mimic Game Style) */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            align-items: center; /* Center Horizontal */
            justify-content: center; /* Center Vertical */
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            background: var(--card-hover);
            border-color: var(--accent-color);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
            transition: transform 0.3s;
        }

        .card:hover .icon {
            transform: scale(1.2) rotate(5deg);
        }

        .card h3 {
            font-size: 1.8rem;
            margin: 0;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-color);
        }

        .card p {
            font-size: 0.9rem;
            color: var(--subtitle-color);
            margin-top: 10px;
            line-height: 1.4;
            max-width: 80%;
        }

        /* STAMP */
        .author-stamp {
            position: fixed;
            bottom: 30px; right: 40px;
            z-index: 20;
            font-family: 'Permanent Marker', cursive;
            color: var(--subtitle-color);
            font-size: 1.2rem;
            transform: rotate(-5deg);
            border: 2px solid var(--subtitle-color);
            padding: 5px 15px;
            border-radius: 5px;
            pointer-events: none;
            opacity: 0.5;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .features { grid-template-columns: 1fr; max-width: 400px; overflow-y: auto; padding-bottom: 100px; }
            .hero h1 { font-size: 4rem; }
            .container { height: auto; padding-top: 100px; }
        }
        
        /* MENU BUTTON OVERRIDE */
        .menu-btn-custom {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: left;
            display: flex; align-items: center; gap: 10px;
            transition: 0.2s;
        }
        .menu-btn-custom:hover { background: var(--accent-color); color: #000; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <div class="hero">
            <h1>FaceVerse</h1>
            <p>Advanced Neural Expressions Suite</p>
        </div>

        <div class="features">
            <div class="card" onclick="window.location.href='detector.html'">
                <div class="icon">🧐</div>
                <h3>Detector</h3>
                <p>Real-time Emotion AI Analysis with 3D Visualization.</p>
            </div>

            <div class="card" onclick="window.location.href='game_hub.html'">
                <div class="icon">🎮</div>
                <h3>Mimic Game</h3>
                <p>Test your reflexes in the Ultimate Face Challenge.</p>
            </div>

            <div class="card" onclick="window.location.href='filters.html'">
                <div class="icon">✨</div>
                <h3>AR Filters</h3>
                <p>Procedural Face Masks & Particle Effects.</p>
            </div>
        </div>
    </div>

    <div class="author-stamp">Pranav Pushya</div>

    <script src="main.js"></script>

    <script>
        // --- 1. CUSTOM MENU LOGIC ---
        function setupHomeMenu() {
            const sidebar = document.getElementById('sidebar');
            if(!sidebar) { requestAnimationFrame(setupHomeMenu); return; }

            // Clean everything first & Center Title (No X button)
            sidebar.innerHTML = `
                <div style="margin-bottom:20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px;">
                    <h2 style="margin:0; color:var(--accent-color); letter-spacing: 2px;">MENU</h2>
                </div>
                <h3 style="font-size:0.8rem; color:#666; margin-bottom:10px;">THEME</h3>
            `;

            // Add Light/Dark Buttons
            const lightBtn = document.createElement('button');
            lightBtn.className = 'menu-btn-custom';
            lightBtn.innerHTML = '☀️ Light Mode';
            lightBtn.onclick = () => { setTheme('light'); toggleMenu(); };
            
            const darkBtn = document.createElement('button');
            darkBtn.className = 'menu-btn-custom';
            darkBtn.innerHTML = '🌙 Dark Mode';
            darkBtn.onclick = () => { setTheme('dark'); toggleMenu(); };

            // Powerful Version Button (Links to Analyzer)
            const powerBtn = document.createElement('button');
            powerBtn.className = 'menu-btn-custom';
            powerBtn.style.borderColor = '#ff0055';
            powerBtn.style.color = '#ff0055';
            powerBtn.innerHTML = '⚡ Powerful Version';
            powerBtn.onclick = () => { 
                window.location.href = 'analyzer.html'; // Fixed Link
            };

            // Append
            sidebar.appendChild(lightBtn);
            sidebar.appendChild(darkBtn);
            
            const div = document.createElement('div');
            div.style.marginTop = "20px";
            div.innerHTML = '<h3 style="font-size:0.8rem; color:#666; margin-bottom:10px;">EXTRAS</h3>';
            sidebar.appendChild(div);
            sidebar.appendChild(powerBtn);
        }
        
        // Wait for main.js to create sidebar
        setTimeout(setupHomeMenu, 100);


        // --- 2. ENHANCED BACKGROUND ANIMATION ---
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;

        // Face-only Emojis
        const emojis = ['🧐', '😎', '🤓', '🤯', '🤠', '🤡', '👻', '👽', '🤖', '🎃', '😺', '🐵', '🤔', '🤫', '🤭'];
        const particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                // Bigger Sizes: 20px - 60px
                this.size = Math.random() * 40 + 20; 
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
                
                // Speed depends on size (Parallax)
                const speed = this.size / 20; 
                this.speedX = (Math.random() - 0.5) * speed * 0.5;
                this.speedY = (Math.random() - 0.5) * speed * 0.5;
                
                this.spin = (Math.random() - 0.5) * 0.02;
                this.angle = Math.random() * Math.PI * 2;
                
                // High Opacity for visibility
                this.opacity = Math.random() * 0.5 + 0.4; 
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.angle += this.spin;

                if (this.x > w + 50) this.x = -50;
                if (this.x < -50) this.x = w + 50;
                if (this.y > h + 50) this.y = -50;
                if (this.y < -50) this.y = h + 50;
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px sans-serif`;
                
                // Check theme
                const isLight = document.documentElement.getAttribute('data-theme') === 'light';
                ctx.fillStyle = isLight ? '#000' : '#fff';
                
                // Draw text directly
                ctx.fillText(this.emoji, -this.size/2, -this.size/2);
                
                ctx.restore();
            }
        }

        function initParticles() {
            particles.length = 0;
            for(let i=0; i<30; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
