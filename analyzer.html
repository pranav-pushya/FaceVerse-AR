<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Data Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            background: var(--bg-color);
        }

        /* LEFT: 3D VISUALIZER */
        #visualizer-container {
            width: 40%;
            height: 100%;
            position: relative;
            border-right: 1px solid var(--accent-color);
            background: rgba(0,0,0,0.2);
        }

        #webcam-preview {
            position: absolute;
            top: 20px; left: 20px;
            width: 160px; height: 120px;
            border: 2px solid var(--accent-color);
            opacity: 0.7;
            transform: scaleX(-1);
        }

        /* RIGHT: DATA GRID */
        #data-container {
            width: 60%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        h2 { 
            border-bottom: 2px solid var(--accent-color); 
            padding-bottom: 10px; 
            position: sticky; top: 0; 
            background: var(--bg-color); 
            z-index: 5;
        }

        .data-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .label { width: 180px; text-align: right; padding-right: 10px; opacity: 0.8; }
        
        .bar-track { 
            flex-grow: 1; 
            height: 8px; 
            background: rgba(128,128,128,0.2); 
            margin-right: 10px; 
        }
        
        .bar-fill { 
            height: 100%; 
            width: 0%; 
            background: var(--accent-color); 
            transition: width 0.1s; 
        }

        .value { width: 40px; font-weight: bold; }

        .back-btn {
            position: absolute;
            bottom: 20px; left: 20px;
            color: var(--accent-color);
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="visualizer-container">
        <video id="webcam-preview" autoplay playsinline></video>
        <canvas id="landmark-canvas" style="
            position:absolute; top:0; left:0;
            width:160px; height:120px;
            pointer-events:none; z-index:5;
        "></canvas>
        <div id="mesh-toggle" onclick="toggleMesh()" style="
            position:absolute; top:8px; right:8px;
            background:rgba(0,255,204,0.15);
            border:1px solid #00ffcc; color:#00ffcc;
            font-size:11px; font-weight:600; padding:4px 10px;
            border-radius:6px; cursor:pointer; z-index:10;
            letter-spacing:1px;
        ">MESH ON</div>
        <div class="back-btn" onclick="window.location.href='index.html'">← BACK TO HOME</div>
    </div>

    <div id="data-container">
        <h2>RAW BLENDSHAPES (52 Points)</h2>
        <div id="blendshape-list">
            <p>Initializing AI Models...</p>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        let faceLandmarker, video;
        let scene, camera, renderer, faceMesh;
        
        async function init() {
            try {
                // 1. Setup Three.js (Wireframe Head)
                const container = document.getElementById('visualizer-container');
                scene = new THREE.Scene();
                
                camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.z = 4;

                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                // Simple geometry representing head rotation
                const geometry = new THREE.IcosahedronGeometry(1.2, 1);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x00ffcc, 
                    wireframe: true,
                    transparent: true, opacity: 0.5 
                });
                faceMesh = new THREE.Mesh(geometry, material);
                scene.add(faceMesh);

                // 2. Setup AI
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: true,
                    outputFacialTransformationMatrixes: true,
                    outputFaceLandmarks: true,
                    runningMode: "VIDEO",
                    numFaces: 1
                });

                // 3. Webcam
                video = document.getElementById('webcam-preview');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 1280, height: 720, facingMode: 'user' } 
                    });
                    video.srcObject = stream;
                } catch(err) {
                    const msg = err.name === 'NotAllowedError'
                        ? '🚫 Camera denied. Allow camera in browser settings and reload.'
                        : err.name === 'NotFoundError'
                        ? '📷 No camera detected on this device.'
                        : `⚠️ Camera error: ${err.message}`;
                    document.getElementById('blendshape-list').innerHTML = `
                        <div style="text-align:center;padding:3rem;color:var(--accent-color)">
                            <div style="font-size:3rem;margin-bottom:1rem">📷</div>
                            <p style="font-size:1rem;margin-bottom:1.5rem">${msg}</p>
                            <button onclick="location.reload()" 
                                style="padding:.6rem 1.5rem;background:var(--accent-color);
                                       color:#000;border:none;border-radius:8px;
                                       cursor:pointer;font-size:1rem;font-weight:bold">
                                Retry
                            </button>
                        </div>`;
                    return;
                }
                video.addEventListener("loadeddata", () => {
                    document.getElementById('blendshape-list').innerHTML = "";
                    animate();
                });

                window.addEventListener('resize', () => {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                });
            } catch (err) {
                const msg = err.name === 'NotAllowedError'
                    ? '🚫 Camera access denied. Allow camera in browser settings and reload.'
                    : err.name === 'NotFoundError'
                    ? '📷 No camera detected on this device.'
                    : `⚠️ Error: ${err.message}`;
                document.getElementById('blendshape-list').innerHTML = `
                    <div style="text-align:center; padding:3rem; color:var(--accent-color)">
                        <div style="font-size:3rem; margin-bottom:1rem">📷</div>
                        <p style="font-size:1rem; margin-bottom:1.5rem">${msg}</p>
                        <button onclick="location.reload()" 
                            style="padding:.6rem 1.5rem; background:var(--accent-color);
                                   color:#000; border:none; border-radius:8px;
                                   cursor:pointer; font-size:1rem; font-weight:bold">
                            Retry
                        </button>
                    </div>`;
            }
        }

        function updateUI(blendshapes) {
            const list = document.getElementById('blendshape-list');
            
            // Generate rows only once
            if(list.childElementCount === 0) {
                blendshapes.forEach(b => {
                    const row = document.createElement('div');
                    row.className = 'data-row';
                    row.innerHTML = `
                        <div class="label">${b.categoryName}</div>
                        <div class="bar-track"><div class="bar-fill" id="bar-${b.categoryName}"></div></div>
                        <div class="value" id="val-${b.categoryName}">0.0</div>
                    `;
                    list.appendChild(row);
                });
            }

            // Update values
            blendshapes.forEach(b => {
                const bar = document.getElementById(`bar-${b.categoryName}`);
                const val = document.getElementById(`val-${b.categoryName}`);
                if(bar) {
                    bar.style.width = (b.score * 100) + "%";
                    val.innerText = b.score.toFixed(2);
                    // Highlight active muscles
                    bar.style.backgroundColor = b.score > 0.4 ? 'var(--accent-color)' : '#555';
                }
            });
        }

        let meshVisible = true;
        window.toggleMesh = function() {
            meshVisible = !meshVisible;
            document.getElementById('mesh-toggle').textContent = meshVisible ? 'MESH ON' : 'MESH OFF';
            document.getElementById('mesh-toggle').style.color = meshVisible ? '#00ffcc' : '#666';
            document.getElementById('mesh-toggle').style.borderColor = meshVisible ? '#00ffcc' : '#666';
        };

        const lmCanvas = document.getElementById('landmark-canvas');
        const lmCtx = lmCanvas.getContext('2d');

        const FACE_CONNECTIONS = [
            [10,338],[338,297],[297,332],[332,284],[284,251],[251,389],[389,356],
            [356,454],[454,323],[323,361],[361,288],[288,397],[397,365],[365,379],
            [379,378],[378,400],[400,377],[377,152],[152,148],[148,176],[176,149],
            [149,150],[150,136],[136,172],[172,58],[58,132],[132,93],[93,234],
            [234,127],[127,162],[162,21],[21,54],[54,103],[103,67],[67,109],[109,10],
            [33,7],[7,163],[163,144],[144,145],[145,153],[153,154],[154,155],
            [155,133],[33,246],[246,161],[161,160],[160,159],[159,158],[158,157],
            [157,173],[173,133],[362,382],[382,381],[381,380],[380,374],[374,373],
            [373,390],[390,249],[249,263],[362,398],[398,384],[384,385],[385,386],
            [386,387],[387,388],[388,466],[466,263],[1,2],[2,98],[98,97],[97,2],
            [0,267],[267,269],[269,270],[270,409],[409,291],[291,375],[375,321],
            [321,405],[405,314],[314,17],[17,84],[84,181],[181,91],[91,146],
            [146,61],[61,185],[185,40],[40,39],[39,37],[37,0]
        ];

        function drawLandmarks(landmarks) {
            const w = lmCanvas.width;
            const h = lmCanvas.height;
            lmCtx.clearRect(0, 0, w, h);
            if (!meshVisible) return;

            lmCtx.strokeStyle = 'rgba(0,255,204,0.35)';
            lmCtx.lineWidth = 0.8;
            FACE_CONNECTIONS.forEach(([a, b]) => {
                if (!landmarks[a] || !landmarks[b]) return;
                lmCtx.beginPath();
                lmCtx.moveTo(landmarks[a].x * w, landmarks[a].y * h);
                lmCtx.lineTo(landmarks[b].x * w, landmarks[b].y * h);
                lmCtx.stroke();
            });

            lmCtx.fillStyle = 'rgba(0,255,204,0.9)';
            landmarks.forEach(pt => {
                lmCtx.beginPath();
                lmCtx.arc(pt.x * w, pt.y * h, 1.2, 0, Math.PI * 2);
                lmCtx.fill();
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (faceLandmarker && video.currentTime > 0) {
                const results = faceLandmarker.detectForVideo(video, performance.now());

                if (results.faceBlendshapes.length > 0) {
                    updateUI(results.faceBlendshapes[0].categories);
                }
                if (results.faceLandmarks && results.faceLandmarks.length > 0) {
                    lmCanvas.width = video.videoWidth || 160;
                    lmCanvas.height = video.videoHeight || 120;
                    drawLandmarks(results.faceLandmarks[0]);
                } else {
                    lmCtx.clearRect(0, 0, lmCanvas.width, lmCanvas.height);
                }
                if (results.facialTransformationMatrixes.length > 0) {
                    const matrix = new THREE.Matrix4().fromArray(results.facialTransformationMatrixes[0].data);
                    const rotation = new THREE.Euler().setFromRotationMatrix(matrix);
                    faceMesh.rotation.set(rotation.x, rotation.y, rotation.z);
                }
            }
            renderer.render(scene, camera);
        }

        new MutationObserver(() => {
            const t = document.documentElement.getAttribute('data-theme');
            if (faceMesh) {
                faceMesh.material.color.setHex(t === 'light' ? 0x333333 : 0x00ffcc);
                faceMesh.material.needsUpdate = true;
            }
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        window.addEventListener('beforeunload', () => {
            const v = document.getElementById('webcam-preview');
            if (v && v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
            if (renderer) renderer.dispose();
        });

        init();
    </script>
    <script src="main.js"></script>
</body>
</html>
