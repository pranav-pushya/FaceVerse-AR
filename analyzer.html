<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raw Data Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎭</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            background: var(--bg-color);
        }

        /* LEFT: 3D VISUALIZER */
        #visualizer-container {
            width: 40%;
            height: 100%;
            position: relative;
            border-right: 1px solid var(--accent-color);
            background: rgba(0,0,0,0.2);
        }

        #webcam-preview {
            position: absolute;
            top: 20px; left: 20px;
            width: 160px; height: 120px;
            border: 2px solid var(--accent-color);
            opacity: 0.7;
            transform: scaleX(-1);
        }

        /* RIGHT: DATA GRID */
        #data-container {
            width: 60%;
            height: 100%;
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        h2 { 
            border-bottom: 2px solid var(--accent-color); 
            padding-bottom: 10px; 
            position: sticky; top: 0; 
            background: var(--bg-color); 
            z-index: 5;
        }

        .data-row {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 12px;
        }

        .label { width: 180px; text-align: right; padding-right: 10px; opacity: 0.8; }
        
        .bar-track { 
            flex-grow: 1; 
            height: 8px; 
            background: rgba(128,128,128,0.2); 
            margin-right: 10px; 
        }
        
        .bar-fill { 
            height: 100%; 
            width: 0%; 
            background: var(--accent-color); 
            transition: width 0.1s; 
        }

        .value { width: 40px; font-weight: bold; }

        .back-btn {
            position: absolute;
            bottom: 20px; left: 20px;
            color: var(--accent-color);
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="visualizer-container">
        <video id="webcam-preview" autoplay playsinline></video>
        <div class="back-btn" onclick="window.location.href='index.html'">← BACK TO HOME</div>
    </div>

    <div id="data-container">
        <h2>RAW BLENDSHAPES (52 Points)</h2>
        <div id="blendshape-list">
            <p>Initializing AI Models...</p>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        let faceLandmarker, video;
        let scene, camera, renderer, faceMesh;
        
        async function init() {
            try {
                // 1. Setup Three.js (Wireframe Head)
                const container = document.getElementById('visualizer-container');
                scene = new THREE.Scene();
                
                camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
                camera.position.z = 4;

                renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(container.clientWidth, container.clientHeight);
                container.appendChild(renderer.domElement);

                // Simple geometry representing head rotation
                const geometry = new THREE.IcosahedronGeometry(1.2, 1);
                const material = new THREE.MeshBasicMaterial({ 
                    color: 0x00ffcc, 
                    wireframe: true,
                    transparent: true, opacity: 0.5 
                });
                faceMesh = new THREE.Mesh(geometry, material);
                scene.add(faceMesh);

                // 2. Setup AI
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`,
                        delegate: "GPU"
                    },
                    outputFaceBlendshapes: true,
                    outputFacialTransformationMatrixes: true,
                    runningMode: "VIDEO",
                    numFaces: 1
                });

                // 3. Webcam
                video = document.getElementById('webcam-preview');
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 1280, height: 720, facingMode: 'user' } 
                    });
                    video.srcObject = stream;
                } catch(err) {
                    const msg = err.name === 'NotAllowedError'
                        ? '🚫 Camera denied. Allow camera in browser settings and reload.'
                        : err.name === 'NotFoundError'
                        ? '📷 No camera detected on this device.'
                        : `⚠️ Camera error: ${err.message}`;
                    document.getElementById('blendshape-list').innerHTML = `
                        <div style="text-align:center;padding:3rem;color:var(--accent-color)">
                            <div style="font-size:3rem;margin-bottom:1rem">📷</div>
                            <p style="font-size:1rem;margin-bottom:1.5rem">${msg}</p>
                            <button onclick="location.reload()" 
                                style="padding:.6rem 1.5rem;background:var(--accent-color);
                                       color:#000;border:none;border-radius:8px;
                                       cursor:pointer;font-size:1rem;font-weight:bold">
                                Retry
                            </button>
                        </div>`;
                    return;
                }
                video.addEventListener("loadeddata", () => {
                    document.getElementById('blendshape-list').innerHTML = "";
                    animate();
                });

                window.addEventListener('resize', () => {
                    camera.aspect = container.clientWidth / container.clientHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(container.clientWidth, container.clientHeight);
                });
            } catch (err) {
                const msg = err.name === 'NotAllowedError'
                    ? '🚫 Camera access denied. Allow camera in browser settings and reload.'
                    : err.name === 'NotFoundError'
                    ? '📷 No camera detected on this device.'
                    : `⚠️ Error: ${err.message}`;
                document.getElementById('blendshape-list').innerHTML = `
                    <div style="text-align:center; padding:3rem; color:var(--accent-color)">
                        <div style="font-size:3rem; margin-bottom:1rem">📷</div>
                        <p style="font-size:1rem; margin-bottom:1.5rem">${msg}</p>
                        <button onclick="location.reload()" 
                            style="padding:.6rem 1.5rem; background:var(--accent-color);
                                   color:#000; border:none; border-radius:8px;
                                   cursor:pointer; font-size:1rem; font-weight:bold">
                            Retry
                        </button>
                    </div>`;
            }
        }

        function updateUI(blendshapes) {
            const list = document.getElementById('blendshape-list');
            
            // Generate rows only once
            if(list.childElementCount === 0) {
                blendshapes.forEach(b => {
                    const row = document.createElement('div');
                    row.className = 'data-row';
                    row.innerHTML = `
                        <div class="label">${b.categoryName}</div>
                        <div class="bar-track"><div class="bar-fill" id="bar-${b.categoryName}"></div></div>
                        <div class="value" id="val-${b.categoryName}">0.0</div>
                    `;
                    list.appendChild(row);
                });
            }

            // Update values
            blendshapes.forEach(b => {
                const bar = document.getElementById(`bar-${b.categoryName}`);
                const val = document.getElementById(`val-${b.categoryName}`);
                if(bar) {
                    bar.style.width = (b.score * 100) + "%";
                    val.innerText = b.score.toFixed(2);
                    // Highlight active muscles
                    bar.style.backgroundColor = b.score > 0.4 ? 'var(--accent-color)' : '#555';
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (faceLandmarker && video.currentTime > 0) {
                const results = faceLandmarker.detectForVideo(video, performance.now());
                if (results.faceBlendshapes.length > 0) {
                    updateUI(results.faceBlendshapes[0].categories);
                }
                if (results.facialTransformationMatrixes.length > 0) {
                    const matrix = new THREE.Matrix4().fromArray(results.facialTransformationMatrixes[0].data);
                    const rotation = new THREE.Euler().setFromRotationMatrix(matrix);
                    faceMesh.rotation.set(rotation.x, rotation.y, rotation.z);
                }
            }
            renderer.render(scene, camera);
        }

        init();
    </script>
    <script src="main.js"></script>
</body>
</html>
