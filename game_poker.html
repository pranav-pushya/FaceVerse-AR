<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker Face - FaceVerse</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>😐</text></svg>">
    <link rel="stylesheet" href="style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
        body { overflow:hidden; font-family:'Bangers',cursive; user-select:none; background:#0a0a0a!important; margin:0; }
        #webcam { position:fixed; inset:0; width:100vw; height:100vh; object-fit:cover; transform:scaleX(-1); z-index:0; }
        .hud-overlay { position:fixed; inset:0; z-index:10; pointer-events:none; }
        #stability-ring { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:10; pointer-events:none; }
        #timer { position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:15; font-size:4rem; color:#fff; text-shadow:0 0 20px rgba(0,255,204,0.5); }
        #stability-bar-wrap { position:fixed; bottom:40px; left:50%; transform:translateX(-50%); width:60%; height:16px; background:rgba(0,0,0,0.6); border-radius:8px; border:2px solid rgba(255,255,255,0.2); z-index:15; overflow:hidden; }
        #stability-bar { height:100%; width:100%; background:linear-gradient(90deg,#00ffcc,#00ff88); border-radius:6px; transition:width 0.15s; }
        #status { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:15; font-size:2.5rem; color:#ff0055; text-shadow:0 0 30px #ff0055; pointer-events:none; opacity:0; transition:opacity 0.2s; }
        #score-display { position:fixed; top:24px; right:32px; z-index:15; font-size:2rem; color:#ffcc00; text-shadow:2px 2px #000; }
        .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:30; }
        .overlay.hidden { display:none; }
        .overlay h1 { font-size:4rem; color:#00ffcc; margin:0; }
        .overlay h1.red { color:#ff0055; }
        .overlay p { color:#fff; font-size:1.3rem; margin:8px 0; text-align:center; max-width:500px; }
        .overlay button { padding:14px 48px; font-size:1.8rem; font-family:'Bangers',cursive; background:#00ffcc; color:#000; border:none; border-radius:12px; cursor:pointer; margin-top:16px; }
        .overlay button:hover { transform:scale(1.05); }
        .back-link { margin-top:16px; color:#888; font-family:'Segoe UI',sans-serif; font-size:0.9rem; cursor:pointer; text-decoration:underline; }
    </style>
</head>
<body>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="stability-ring" width="200" height="200"></canvas>
    <div id="timer">60</div>
    <div id="score-display">⭐ 0</div>
    <div id="stability-bar-wrap"><div id="stability-bar"></div></div>
    <div id="status"></div>

    <div class="overlay" id="start-screen">
        <h1>😐 POKER FACE</h1>
        <p>Keep a perfectly neutral face for 60 seconds. Any expression = you lose stability. How long can you hold it?</p>
        <button onclick="initGame()">CHALLENGE</button>
        <div class="back-link" onclick="window.location.href='game_hub.html'">← Back to Hub</div>
    </div>

    <div class="overlay hidden" id="gameover-screen">
        <h1 class="red">TIME'S UP!</h1>
        <p class="score-big" id="final-score" style="font-size:3rem;color:#ffcc00">0</p>
        <p id="hs-msg" style="color:#00ffcc"></p>
        <button onclick="initGame()">RETRY</button>
        <div class="back-link" onclick="window.location.href='game_hub.html'">← Back to Hub</div>
    </div>

    <script type="importmap">
    { "imports": { "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/+esm" } }
    </script>
    <script src="main.js"></script>
    <script src="audio-fx.js"></script>
    <script src="ai-voice.js"></script>
    <script src="capture-module.js"></script>

    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

        const video = document.getElementById('webcam');
        const ringCanvas = document.getElementById('stability-ring');
        const ringCtx = ringCanvas.getContext('2d');
        const timerEl = document.getElementById('timer');
        const barEl = document.getElementById('stability-bar');
        const statusEl = document.getElementById('status');
        const scoreEl = document.getElementById('score-display');

        let faceLandmarker, playing = false;
        let stability = 100, score = 0, timeLeft = 60, lastTick = 0;
        let expressionLevel = 0;

        // ─── MEDIAPIPE SETUP ────────────────────────────────────
        async function setup() {
            const stream = await navigator.mediaDevices.getUserMedia({ video:{ width:640, height:480 } });
            video.srcObject = stream;
            await new Promise(r => video.onloadeddata = r);
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
            faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:"GPU" },
                runningMode:"VIDEO", numFaces:1, outputFaceBlendshapes:true
            });
        }
        setup();

        window.initGame = function() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            stability = 100; score = 0; timeLeft = 60;
            playing = true;
            lastTick = performance.now();
            if (typeof Voice !== 'undefined') Voice.say('Poker Face. Keep still.');
            loop();
        };

        function loop() {
            if (!playing) return;
            requestAnimationFrame(loop);
            const now = performance.now();

            // Timer
            if (now - lastTick >= 1000) {
                timeLeft--;
                lastTick = now;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) { endGame(); return; }
                // Score: points per second based on stability
                const bonus = Math.floor(stability / 20);
                score += bonus;
                scoreEl.textContent = '⭐ ' + score;
            }

            // Face tracking
            if (faceLandmarker && video.readyState >= 2) {
                const r = faceLandmarker.detectForVideo(video, now);
                if (r.faceBlendshapes && r.faceBlendshapes.length > 0) {
                    const bs = {};
                    r.faceBlendshapes[0].categories.forEach(c => bs[c.categoryName] = c.score);

                    // Calculate total expression deviation from neutral
                    const keys = ['mouthSmileLeft','mouthSmileRight','browInnerUp','browDownLeft','browDownRight',
                                  'jawOpen','mouthFrownLeft','mouthFrownRight','eyeSquintLeft','eyeSquintRight',
                                  'cheekPuff','mouthPucker','noseSneerLeft','noseSneerRight'];
                    let total = 0;
                    keys.forEach(k => total += (bs[k] || 0));
                    expressionLevel = total / keys.length;
                }
            }

            // Stability logic
            if (expressionLevel > 0.15) {
                stability = Math.max(0, stability - expressionLevel * 8);
                statusEl.textContent = expressionLevel > 0.3 ? '😬 EXPRESSION DETECTED!' : '⚠️ Stay neutral!';
                statusEl.style.opacity = '1';
                if (typeof FX !== 'undefined' && expressionLevel > 0.3 && Math.random() < 0.05) FX.countdown();
            } else {
                stability = Math.min(100, stability + 0.3);
                statusEl.style.opacity = '0';
            }

            barEl.style.width = stability + '%';
            barEl.style.background = stability > 60 ? 'linear-gradient(90deg,#00ffcc,#00ff88)' :
                                     stability > 30 ? 'linear-gradient(90deg,#ffcc00,#ff8800)' :
                                     'linear-gradient(90deg,#ff0055,#ff0000)';

            // Draw ring
            ringCtx.clearRect(0, 0, 200, 200);
            ringCtx.beginPath();
            ringCtx.arc(100, 100, 80, -Math.PI/2, -Math.PI/2 + (stability/100) * Math.PI * 2);
            ringCtx.strokeStyle = stability > 60 ? '#00ffcc' : stability > 30 ? '#ffcc00' : '#ff0055';
            ringCtx.lineWidth = 6;
            ringCtx.lineCap = 'round';
            ringCtx.stroke();
        }

        function endGame() {
            playing = false;
            const prev = parseInt(localStorage.getItem('faceverse_hs_poker') || '0');
            const isNew = score > prev;
            if (isNew) localStorage.setItem('faceverse_hs_poker', score);

            const runs = JSON.parse(localStorage.getItem('faceverse_runs') || '[]');
            runs.push({ mode: 'Poker', score, date: new Date().toISOString() });
            localStorage.setItem('faceverse_runs', JSON.stringify(runs));

            document.getElementById('final-score').textContent = '😐 Score: ' + score;
            document.getElementById('hs-msg').textContent = isNew ? '🏆 NEW HIGH SCORE!' : 'Best: ' + prev;
            document.getElementById('gameover-screen').classList.remove('hidden');
            if (typeof FX !== 'undefined') FX.success();
            if (typeof Voice !== 'undefined') Voice.say('Challenge complete. Score ' + score);
        }
    </script>
</body>
</html>
